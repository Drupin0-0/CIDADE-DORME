<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade Dorme - O Jogo da Noite</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #18161a;
            --bg-card: #242126;
            --bg-input: #2d2a30;
            --text: #efe7dd;
            --text-muted: #8a8075;
            --accent: #c4a06c;
            --accent-dim: #c4a06c20;
            --border: #423b34;
            --radius: 4px;
            --font-serif: 'Cinzel', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(80, 60, 40, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(40, 30, 20, 0.4) 0%, transparent 50%);
            padding: 10px;
            overflow-x: hidden;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-brand {
            text-align: center;
            margin-bottom: 14px;
            position: relative;
            border-bottom: 2px double var(--border);
            padding-bottom: 8px;
        }

        .header-brand::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 1px;
            background: var(--accent);
        }

        .moon-icon {
            font-size: 38px;
            display: block;
            color: var(--text);
            filter: drop-shadow(0 0 15px rgba(196, 160, 108, 0.2));
            margin-bottom: -4px;
        }

        .logo-title {
            font-family: var(--font-serif);
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--text);
            text-transform: uppercase;
            margin: 0;
            line-height: 1;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
        }

        .logo-title span {
            font-weight: 900;
            font-style: italic;
            color: var(--accent);
        }

        .logo-subtitle {
            font-size: 0.55em;
            color: var(--text-muted);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 300;
            border-top: 1px solid var(--border);
            padding-top: 4px;
            display: inline-block;
        }

        .screen {
            display: none;
            animation: fadeSlide 0.3s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }

        h2 {
            font-family: var(--font-serif);
            font-size: 0.95em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .player-count-input-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .player-count-input {
            width: 70px;
            padding: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.2em;
            font-weight: 700;
            text-align: center;
            outline: none;
            font-family: var(--font-serif);
            border-radius: var(--radius);
        }

        .role-toggles {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 28vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .role-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            cursor: pointer;
            transition: 0.2s ease;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
        }

        .role-toggle.active {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .role-toggle-icon {
            font-size: 1.2em;
            width: 25px;
            text-align: center;
        }

        .role-toggle-info {
            flex: 1;
        }

        .role-toggle-name {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text);
        }

        .role-toggle-desc {
            font-size: 0.68em;
            color: var(--text-muted);
            line-height: 1.2;
        }

        .role-toggle-badge {
            font-size: 0.55em;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .badge-on {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border-radius: var(--radius);
            font-size: 0.78em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.2s ease;
            width: 100%;
            font-family: var(--font-serif);
            background: transparent;
            color: var(--text);
        }

        .btn-primary {
            background: var(--accent);
            color: #18161a;
            border: 1px solid var(--accent);
        }

        .btn-primary:hover {
            background: #d4b07c;
        }

        .btn-danger {
            background: transparent;
            color: #d65d5d;
            border: 1px solid rgba(214, 93, 93, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-success {
            color: #80dba0;
            border-color: rgba(84,204,125,0.3);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: default;
            pointer-events: none;
        }

        .name-inputs {
            max-height: 38vh;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 10px;
        }

        .name-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 0 10px;
            border-radius: var(--radius);
            margin-bottom: 6px;
        }

        .name-input-num {
            color: var(--text-muted);
            font-size: 0.75em;
            font-weight: 700;
            font-family: var(--font-serif);
        }

        .name-input-group input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.88em;
            padding: 8px 0;
            outline: none;
            font-family: var(--font-sans);
        }

        .reveal-card {
            text-align: center;
            padding: 24px 14px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            cursor: pointer;
            background: rgba(0,0,0,0.3);
            border-radius: var(--radius);
            position: relative;
        }

        .reveal-card.revealed {
            border-color: var(--accent);
        }

        .reveal-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .reveal-text {
            color: var(--text-muted);
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        .reveal-role-name {
            font-family: var(--font-serif);
            font-size: 1.6em;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .reveal-sub-name {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-top: 4px;
            font-style: italic;
        }

        .reveal-role-desc {
            color: var(--text-muted);
            font-size: 0.78em;
            margin-top: 6px;
            line-height: 1.3;
        }

        .space-tip {
            font-size: 0.65em;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 10px;
            border-top: 1px dashed var(--border);
            padding-top: 6px;
            text-align: center;
            width: 100%;
        }

        .game-phase-indicator {
            text-align: center;
            padding: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.7em;
            margin-bottom: 10px;
            color: var(--text-muted);
            font-family: var(--font-serif);
        }

        .phase-night {
            color: #9ea0c0;
            border-color: #3a3a55;
        }

        .phase-day {
            color: var(--accent);
            border-color: var(--accent-dim);
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .player-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 0.78em;
            border-radius: var(--radius);
            transition: 0.2s ease;
        }

        .player-chip:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--border);
        }

        .player-chip.selected {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .player-chip-content {
            flex: 1;
            min-width: 0;
        }

        .player-chip-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-chip-coins {
            color: var(--accent);
            font-size: 0.72em;
        }

        .inventory-mini {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            margin-top: 2px;
        }

        .inventory-mini span {
            font-size: 0.75em;
            background: rgba(196,160,108,0.08);
            border: 1px solid rgba(196,160,108,0.15);
            padding: 0 3px;
            border-radius: 2px;
        }

        .graveyard-chip {
            font-size: 0.65em;
            padding: 4px 6px;
            background: rgba(0,0,0,0.6);
            color: #777;
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            cursor: pointer;
        }

        .result-banner {
            padding: 10px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
            text-align: center;
            font-size: 0.82em;
            background: rgba(0,0,0,0.3);
        }

        .result-death { border-color: rgba(214, 93, 93, 0.4); color: #d65d5d; }
        .result-safe { border-color: rgba(84, 204, 125, 0.4); color: #80dba0; }
        .result-info { border-color: rgba(196, 160, 108, 0.4); color: var(--accent); }
        .result-bomb-win { border-color: #c07830; color: #e09940; font-weight: 700; }

        .game-log {
            max-height: 80px;
            overflow-y: auto;
            padding: 6px;
            background: rgba(0,0,0,0.4);
            font-size: 0.65em;
            color: var(--text-muted);
            line-height: 1.4;
            border: 1px solid var(--border);
        }

        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .profile-panel {
            border-left-color: var(--accent);
            animation: fadeSlide 0.2s ease;
            max-height: 60vh;
            overflow-y: auto;
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .profile-name {
            font-family: var(--font-serif);
            font-size: 1.1em;
            color: var(--accent);
        }

        .profile-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            margin-bottom: 6px;
            font-size: 0.8em;
        }

        .profile-stat-value {
            color: var(--accent);
            font-weight: 700;
        }

        .management-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }

        .management-grid .btn {
            padding: 8px 4px;
            font-size: 0.65em;
        }

        .section-title {
            color: var(--text-muted);
            font-size: 0.65em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
            margin: 12px 0 8px;
        }

        .item-card {
            padding: 8px 10px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            margin-bottom: 6px;
        }

        .item-card.purchased { opacity: 0.4; }
        .item-card-header { display: flex; align-items: center; gap: 6px; }
        .item-icon { font-size: 1.2em; }
        .item-name { flex: 1; font-weight: 600; font-size: 0.8em; }
        .item-price { color: var(--accent); font-weight: 700; font-size: 0.75em; }
        .item-description { color: var(--text-muted); font-size: 0.65em; line-height: 1.2; margin: 4px 0; }
        .item-card .btn { padding: 6px; font-size: 0.6em; }

        .item-use-note {
            color: var(--text-muted);
            font-size: 0.65em;
            text-align: center;
            padding: 6px;
            border: 1px dashed var(--border);
            margin-bottom: 8px;
        }

        /* DADO 3D ANIMADO */
        .dice-scene {
            width: 80px;
            height: 80px;
            perspective: 600px;
            margin: 15px auto;
        }

        .dice-cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.8s cubic-bezier(0.2, 0.8, 0.3, 1.2);
            transform: rotateX(0deg) rotateY(0deg);
        }

        .dice-cube.rolling {
            animation: diceRollAnim 0.5s infinite linear;
        }

        @keyframes diceRollAnim {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            50% { transform: rotateX(360deg) rotateY(180deg) rotateZ(180deg); }
            100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(360deg); }
        }

        .dice-face {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #2b272d;
            border: 2px solid var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: 900;
            font-family: var(--font-serif);
            color: var(--accent);
            box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 0 8px rgba(196,160,108,0.2);
        }

        .face-1 { transform: rotateY(0deg) translateZ(40px); }
        .face-6 { transform: rotateY(180deg) translateZ(40px); }
        .face-2 { transform: rotateY(90deg) translateZ(40px); }
        .face-5 { transform: rotateY(-90deg) translateZ(40px); }
        .face-3 { transform: rotateX(-90deg) translateZ(40px); }
        .face-4 { transform: rotateX(90deg) translateZ(40px); }

        .dice-show-1 { transform: rotateY(0deg) rotateX(0deg); }
        .dice-show-6 { transform: rotateY(180deg) rotateX(0deg); }
        .dice-show-2 { transform: rotateY(-90deg) rotateX(0deg); }
        .dice-show-5 { transform: rotateY(90deg) rotateX(0deg); }
        .dice-show-3 { transform: rotateX(90deg) rotateY(0deg); }
        .dice-show-4 { transform: rotateX(-90deg) rotateY(0deg); }

        .number-selector-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin: 10px 0;
        }

        .number-btn {
            padding: 8px 0;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1em;
            font-weight: 700;
            border-radius: var(--radius);
            cursor: pointer;
        }

        .number-btn.selected {
            background: var(--accent);
            color: #18161a;
            border-color: var(--accent);
        }

        @media (max-width: 420px) {
            .logo-title { font-size: 1.8em; }
        }
    </style>
</head>

<body>

<div class="app-container">

    <div class="header-brand">
        <span class="moon-icon">🌙</span>
        <div class="logo-title"><span>Cidade</span> Dorme</div>
        <div class="logo-subtitle">O Jogo da Noite</div>
    </div>

    <!-- ========================= CONFIGURAÇÃO ========================== -->
    <div class="screen active" id="screen-setup">
        <div class="card">
            <h2>+ Configuração</h2>
            <div class="player-count-input-container">
                <label style="color:var(--text-muted);font-size:0.7em;letter-spacing:1.5px;text-transform:uppercase;">
                    Participantes (5-24)
                </label>
                <input type="number" class="player-count-input" id="playerCountInput" min="5" max="24" value="6">
            </div>
        </div>

        <div class="card">
            <h2>Subclasses (Únicas)</h2>
            <div class="role-toggles" id="subclassToggles"></div>
            <div style="display:flex;gap:6px;margin-top:8px;">
                <button class="btn btn-secondary" id="btnRandomizeSubs">🎲 Sortear</button>
            </div>
            <div style="text-align:center;color:var(--text-muted);font-size:0.7em;margin-top:8px;border-top:1px solid var(--border);padding-top:8px;" id="roleSummary"></div>
        </div>

        <button class="btn btn-primary" id="btnStartSetup">Distribuir Funções</button>
    </div>

    <!-- ========================= NOMES ========================== -->
    <div class="screen" id="screen-names">
        <div class="card">
            <h2>Jogadores</h2>
            <p style="color:var(--text-muted);font-size:0.75em;margin-bottom:10px;text-align:center;">
                Nomeie cada participante.
            </p>
            <div class="name-inputs" id="nameInputs"></div>
            <button class="btn btn-primary" id="btnDistributeRoles">Iniciar Jogo</button>
            <button class="btn btn-secondary" style="margin-top:6px;" id="btnBackToSetup">← Voltar</button>
        </div>
    </div>

    <!-- ========================= REVELAÇÃO ========================== -->
    <div class="screen" id="screen-reveal">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--text-muted);font-size:0.65em;text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid var(--border);padding-bottom:6px;">
                <span>Jogador <span id="revealPlayerNum" style="color:var(--accent);">1</span></span>
                <span id="revealProgress">0 / 0</span>
            </div>

            <div style="text-align:center;font-size:1.1em;font-weight:600;margin-bottom:14px;border:1px solid var(--border);padding:6px;background:rgba(0,0,0,0.2);" id="revealPlayerName">—</div>

            <div class="reveal-card" id="revealCard">
                <span class="reveal-icon">🃏</span>
                <span class="reveal-text">Toque para ver seu destino</span>
                <div class="reveal-role-name" style="display:none;" id="revealRoleName"></div>
                <div class="reveal-sub-name" style="display:none;" id="revealSubName"></div>
                <div class="reveal-role-desc" style="display:none;" id="revealRoleDesc"></div>
                <div class="space-tip">⌨️ Pressione [Espaço] para revelar / avançar</div>
            </div>

            <button class="btn btn-primary" id="btnNextReveal" style="margin-top:10px;display:none;">Próximo (Espaço)</button>
            <button class="btn btn-primary" id="btnStartGameAfterReveal" style="margin-top:10px;display:none;">A Noite Começa (Espaço)</button>
        </div>
    </div>

    <!-- ========================= JOGO ========================== -->
    <div class="screen" id="screen-game">
        <div class="game-phase-indicator phase-night" id="phaseIndicator">
            🌙 Noite — Rodada 0
        </div>

        <div class="card" id="gameMainCard"></div>

        <!-- PERFIL DO JOGADOR -->
        <div class="card profile-panel" id="playerProfilePanel" style="display:none;"></div>

        <!-- JOGADORES & CEMITÉRIO -->
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:8px;">
                <span style="font-size:0.65em;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);">Vivos</span>
                <span style="font-size:0.65em;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);">🪦 Cemitério</span>
            </div>

            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <div style="flex:1;min-width:130px;">
                    <div class="player-grid" id="alivePlayersGrid" style="grid-template-columns:1fr;margin-bottom:0;"></div>
                </div>
                <div style="flex:1;min-width:130px;">
                    <div class="graveyard" id="graveyard" style="flex-direction:column;gap:2px;"></div>
                </div>
            </div>

            <div class="mudo-banner" id="mudoBanner" style="display:none;margin-top:8px;padding:6px;background:rgba(255,255,255,0.02);border:1px solid var(--border);text-align:center;font-size:0.75em;color:var(--text-muted);"></div>
        </div>

        <!-- HISTÓRICO -->
        <div class="card" style="padding:8px 12px;margin-bottom:0;">
            <details>
                <summary style="cursor:pointer;font-size:0.7em;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;">
                    📜 Histórico
                </summary>
                <div class="game-log" id="gameLog" style="margin-top:6px;"></div>
            </details>
        </div>
    </div>

    <!-- ========================= GAME OVER ========================== -->
    <div class="screen" id="screen-gameover">
        <div class="card gameover-card">
            <span class="gameover-icon" id="gameoverIcon">🏆</span>
            <div class="gameover-title" id="gameoverTitle">Fim de Jogo</div>
            <div class="gameover-subtitle" id="gameoverSubtitle">O destino foi decidido.</div>
            <button class="btn btn-primary" id="btnRestart">Nova Partida</button>
        </div>
    </div>

</div>

<script>
(function() {

    const CLASS_DEFS = {
        assassino: { name: 'Assassino', icon: '🔪', team: 'assassino', desc: 'Mate todos os cidadãos.' },
        medico: { name: 'Médico', icon: '💊', team: 'cidadao', desc: 'Pode salvar uma pessoa por noite.' },
        detetive: { name: 'Detetive', icon: '🔍', team: 'cidadao', desc: 'Investiga uma pessoa por noite.' },
        cidadao: { name: 'Cidadão', icon: '👤', team: 'cidadao', desc: 'Vote para descobrir o Assassino.' }
    };

    const SUBCLASS_DEFS = {
        eletricista: { name: 'Eletricista', icon: '⚡', restrictedTo: 'assassino', desc: 'Durante a reunião pode pedir para a cidade dormir (1 uso por partida).' },
        mudo: { name: 'Mudo', icon: '🤫', restrictedTo: 'assassino', desc: 'Silencia um jogador (ou a si mesmo) durante a rodada.' },
        detetive_corrupto: { name: 'Detetive Corrupto', icon: '🔍', restrictedTo: 'assassino', desc: 'Descobre a classe e subclasse de qualquer um durante a Noite (2 usos no jogo).' },
        vingador: { name: 'Vingador', icon: '⚔️', restrictedTo: 'cidadao', desc: 'Quando é morto, pode escolher alguém para morrer junto.' },
        amante: { name: 'Amante', icon: '💘', restrictedTo: 'universal', desc: 'Conecta dois jogadores. Se um morrer, o outro também morre.' },
        prefeito: { name: 'Prefeito', icon: '🏛️', restrictedTo: 'universal', desc: 'Seu voto vale por 2.' },
        bala_magica: { name: 'Bala Mágica', icon: '🔫', restrictedTo: 'universal', desc: 'Possui uma bala capaz de matar qualquer pessoa durante o Dia (1 uso).' },
        bomba: { name: 'Bomba', icon: '💣', restrictedTo: 'universal', desc: 'Seu objetivo é ser eliminado durante a votação.' },
        anjo: { name: 'Anjo', icon: '👼', restrictedTo: 'cidadao', desc: 'Se for morto pelo Assassino, pode reviver um jogador morto (exceto ele mesmo).' }
    };

    const ITEM_DEFS = {
        colete: { name: 'Colete', icon: '🛡️', price: 10, desc: 'Protege contra uma morte durante uma rodada.' },
        lupa: { name: 'Lupa do Detetive', icon: '🔍', price: 40, desc: 'Permite usar a investigação do Detetive uma vez.' },
        coracao: { name: 'Coração Amigo', icon: '❤️', price: 75, desc: 'Revive um jogador morto.' },
        pilula: { name: 'Pílula da Vida', icon: '💊', price: 40, desc: 'Protege alguém na próxima noite.' },
        roleta: { name: 'Roleta Russa All Win', icon: '🎰', price: 5, desc: 'Duelo com dado de 6 lados valendo a vida e todas as moedas.' },
        algema: { name: 'Algema', icon: '⛓️', price: 30, desc: 'Impede um jogador de votar e ser votado na rodada.' },
        faca: { name: 'Faca', icon: '🔪', price: 60, desc: 'Ao usar, mata um jogador imediatamente.' }
    };

    const ITEM_STOCK = 2;

    const screens = {
        setup: document.getElementById('screen-setup'),
        names: document.getElementById('screen-names'),
        reveal: document.getElementById('screen-reveal'),
        game: document.getElementById('screen-game'),
        gameover: document.getElementById('screen-gameover')
    };

    function showScreen(name) {
        Object.values(screens).forEach(screen => screen.classList.remove('active'));
        screens[name].classList.add('active');
    }

    let game = {
        playerCount: 6,
        selectedSubclasses: [],
        selectedClasses: [],
        players: [],
        currentRevealIndex: 0,
        revealed: false,
        phase: 'setup',
        nightStep: 0,
        dayStep: 0,
        nightTargets: {},
        lastSavedPlayer: null,
        mutedPlayer: null,
        eliminatedTonight: [],
        savedTonight: null,
        gameLog: [],
        round: 0,
        winner: null,
        pendingVingadorRevenge: false,
        pendingAngelRevival: false,
        isBlackout: false,
        detetiveUses: {},
        eletricistaUsed: false,
        balaMagicaUsed: {},
        lovers: [],
        amanteDeathTriggered: false,
        profilePlayer: null,
        store: {},
        shieldPlayers: [],
        doctorProtectionPlayers: [],
        handcuffedPlayer: null
    };

    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function getAlivePlayers() { return game.players.filter(p => p.alive); }
    function getDeadPlayers() { return game.players.filter(p => !p.alive); }
    function getPlayerByName(name) { return game.players.find(p => p.name === name); }
    function getPlayerByRole(role) { return game.players.find(p => p.role === role && p.alive); }
    function getAssassino() { return getPlayerByRole('assassino'); }
    function getMedico() { return getPlayerByRole('medico'); }
    function getDetetive() { return getPlayerByRole('detetive'); }
    function getMudo() { return game.players.find(p => p.subclass === 'mudo' && p.alive); }
    function getEletricista() { return game.players.find(p => p.subclass === 'eletricista' && p.alive); }
    function getDetetiveCorrupto() { return game.players.find(p => p.subclass === 'detetive_corrupto' && p.alive); }

    function addLog(message) {
        game.gameLog.push(`[R${game.round}] ${message}`);
        if (game.gameLog.length > 50) game.gameLog.shift();
        updateGameLog();
    }

    function changeCoins(player, amount) {
        if (!player) return;
        player.coins = Math.max(0, (player.coins || 0) + amount);
        addLog(`🪙 ${player.name}: ${amount >= 0 ? '+' : ''}${amount} moedas.`);
        renderPlayerProfile(player.name);
        updateAlivePlayersGrid();
        updateGraveyard();
    }

    function rewardSurvivors() {
        getAlivePlayers().forEach(player => {
            player.coins = (player.coins || 0) + 5;
            addLog(`🪙 ${player.name} sobreviveu (+5 moedas).`);
        });
    }

    function resetStore() {
        game.store = {};
        Object.keys(ITEM_DEFS).forEach(itemId => {
            game.store[itemId] = { stock: ITEM_STOCK, purchasedBy: [] };
        });
    }

    function purchaseItem(playerName, itemId) {
        if (game.phase !== 'day') {
            alert('A loja só está disponível durante o Dia.');
            return;
        }
        const player = getPlayerByName(playerName);
        const item = ITEM_DEFS[itemId];
        if (!player || !item) return;

        if (game.store[itemId].stock <= 0) {
            alert(`O item ${item.name} está esgotado nesta partida.`);
            return;
        }

        if (player.coins < item.price) {
            alert(`${player.name} não possui moedas suficientes (${item.price} 🪙).`);
            return;
        }

        player.coins -= item.price;
        player.inventory.push(itemId);
        game.store[itemId].stock--;
        game.store[itemId].purchasedBy.push(player.name);

        addLog(`🏪 ${player.name} comprou ${item.icon} ${item.name}.`);
        renderPlayerProfile(player.name);
        updateAlivePlayersGrid();
        updateGraveyard();
    }

    function hasItem(player, itemId) {
        return player && player.inventory && player.inventory.includes(itemId);
    }

    function consumeItem(player, itemId) {
        if (!hasItem(player, itemId)) return false;
        player.inventory = player.inventory.filter(item => item !== itemId);
        return true;
    }

    function manualKill(player) {
        if (!player || !player.alive) return;
        player.alive = false;
        addLog(`☠️ Líder matou ${player.name}.`);
        checkWinCondition();
        renderPlayerProfile(player.name);
        updateAlivePlayersGrid();
        updateGraveyard();
    }

    function manualRevive(player) {
        if (!player || player.alive) return;
        player.alive = true;
        addLog(`❤️ Líder reviveu ${player.name}.`);
        game.winner = null;
        renderPlayerProfile(player.name);
        updateAlivePlayersGrid();
        updateGraveyard();
    }

    // Função que ativa o poder do Anjo (chamada apenas quando morre pelo Assassino)
    function triggerAngelRevival(angelPlayer) {
        // Filtra os jogadores mortos, EXCLUINDO o próprio Anjo
        const deadPlayers = getDeadPlayers().filter(p => p.name !== angelPlayer.name);
        
        // Se não houver ninguém para reviver, o poder não faz nada
        if (!deadPlayers.length) {
            addLog(`👼 ${angelPlayer.name} morreu, mas não há ninguém para reviver.`);
            return;
        }

        game.pendingAngelRevival = true;
        const mainCard = document.getElementById('gameMainCard');

        mainCard.innerHTML = `
            <div style="text-align:center;padding:12px;border:1px solid var(--border);margin-bottom:10px;background:rgba(0,0,0,0.3);">
                <div style="font-size:2em;">👼</div>
                <div style="font-weight:700;margin:2px 0;font-family:var(--font-serif);">Poder do Anjo!</div>
                <div style="color:var(--text-muted);font-size:0.75em;">
                    ${angelPlayer.name} foi morto pelo Assassino.<br>
                    Escolha UM jogador morto para reviver (exceto o próprio Anjo).
                </div>
            </div>
            <div class="player-grid" id="angelRevivalGrid" style="grid-template-columns:1fr;"></div>
            <button class="btn btn-primary" id="btnConfirmAngelRevival" disabled>Reviver</button>
            <button class="btn btn-secondary" style="margin-top:6px;" id="btnSkipAngelRevival">Não reviver</button>
        `;

        const grid = document.getElementById('angelRevivalGrid');
        const btn = document.getElementById('btnConfirmAngelRevival');
        let selected = null;

        deadPlayers.forEach(player => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';
            chip.innerHTML = `
                <span class="chip-icon">${CLASS_DEFS[player.role].icon}</span>
                <div class="player-chip-content">
                    <div class="player-chip-name">${player.name}</div>
                </div>
            `;
            chip.onclick = () => {
                grid.querySelectorAll('.player-chip').forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
                selected = player.name;
                btn.disabled = false;
            };
            grid.appendChild(chip);
        });

        btn.onclick = () => {
            if (!selected) return;
            const target = getPlayerByName(selected);
            if (target && !target.alive) {
                manualRevive(target);
                addLog(`👼 ${angelPlayer.name} (Anjo) reviveu ${target.name}!`);
            }
            // Continua o jogo
            game.pendingAngelRevival = false;
            continueAfterAngelRevival();
        };

        document.getElementById('btnSkipAngelRevival').onclick = () => {
            addLog(`👼 ${angelPlayer.name} (Anjo) optou por não reviver ninguém.`);
            game.pendingAngelRevival = false;
            continueAfterAngelRevival();
        };
    }

    function continueAfterAngelRevival() {
        // Verifica se o jogo acabou com o revive
        if (checkWinCondition()) return;
        // Se a fase ainda for noite, continua a resolução
        if (game.phase === 'night') {
            game.nightStep++;
            renderGame();
        } else {
            // Se for dia, recarrega a fase
            renderGame();
        }
    }

    function killPlayer(player, cause, triggerVingador = true, isVote = false, ignoreShield = false) {
        if (!player || !player.alive) return false;

        if (!ignoreShield && game.shieldPlayers.includes(player.name)) {
            game.shieldPlayers = game.shieldPlayers.filter(name => name !== player.name);
            addLog(`🛡️ Colete protegeu ${player.name}!`);
            return false;
        }

        player.alive = false;
        addLog(`${player.name} foi eliminado(a) — ${cause}`);

        // --- LÓGICA DO ANJO ---
        // Verifica se o Anjo foi morto PELO ASSASSINO (não por votação ou outra causa)
        // E se o poder ainda não foi ativado
        if (cause === 'Assassino' && player.subclass === 'anjo' && !game.pendingAngelRevival) {
            // Ativa o poder do Anjo
            triggerAngelRevival(player);
            // O jogo pausa aqui, o fluxo continua em continueAfterAngelRevival
            return true;
        }

        // --- LÓGICA DOS AMANTES ---
        if (game.lovers.includes(player.name) && !game.amanteDeathTriggered) {
            const otherLover = game.players.find(p => game.lovers.includes(p.name) && p.name !== player.name && p.alive);
            if (otherLover) {
                game.amanteDeathTriggered = true;
                addLog(`💘 ${player.name} morreu. ${otherLover.name} também morreu (Amantes).`);
                killPlayer(otherLover, 'Amante', false, false, true);
                game.amanteDeathTriggered = false;
            }
        }

        // --- LÓGICA DO VINGADOR ---
        if (triggerVingador && player.subclass === 'vingador' && !isVote && player.role !== 'assassino') {
            triggerVingadorRevenge(player);
        }

        return true;
    }

    function triggerVingadorRevenge(vingadorPlayer) {
        const aliveOthers = getAlivePlayers().filter(p => p.name !== vingadorPlayer.name);
        if (!aliveOthers.length) return;

        game.pendingVingadorRevenge = true;
        const mainCard = document.getElementById('gameMainCard');

        mainCard.innerHTML = `
            <div style="text-align:center;padding:12px;border:1px solid var(--border);margin-bottom:10px;background:rgba(0,0,0,0.3);">
                <div style="font-size:2em;">⚔️</div>
                <div style="font-weight:700;margin:2px 0;font-family:var(--font-serif);">Vingança!</div>
                <div style="color:var(--text-muted);font-size:0.75em;">${vingadorPlayer.name} foi morto e pode levar alguém junto.</div>
            </div>
            <div class="player-grid" id="vingadorRevengeGrid" style="grid-template-columns:1fr;"></div>
            <button class="btn btn-danger" id="btnConfirmRevenge" disabled>Confirmar Vingança</button>
            <button class="btn btn-secondary" style="margin-top:6px;" id="btnSkipRevenge">Perdoar</button>
        `;

        const grid = document.getElementById('vingadorRevengeGrid');
        const btn = document.getElementById('btnConfirmRevenge');
        let selected = null;

        aliveOthers.forEach(player => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';
            chip.innerHTML = `
                <span class="chip-icon">${CLASS_DEFS[player.role].icon}</span>
                <div class="player-chip-content">
                    <div class="player-chip-name">${player.name}</div>
                </div>
            `;
            chip.onclick = () => {
                grid.querySelectorAll('.player-chip').forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
                selected = player.name;
                btn.disabled = false;
            };
            grid.appendChild(chip);
        });

        btn.onclick = () => {
            if (!selected) return;
            const target = getPlayerByName(selected);
            if (target && target.alive) {
                killPlayer(target, 'Vingança', false, false, true);
                addLog(`⚔️ ${vingadorPlayer.name} levou ${target.name} junto!`);
            }
            game.pendingVingadorRevenge = false;
            if (checkWinCondition()) return;
            if (game.phase === 'night') {
                game.nightStep++;
                renderGame();
            } else {
                proceedToNextNight();
            }
        };

        document.getElementById('btnSkipRevenge').onclick = () => {
            game.pendingVingadorRevenge = false;
            if (game.phase === 'night') {
                game.nightStep++;
                renderGame();
            } else {
                proceedToNextNight();
            }
        };
    }

    function useBalaMagica(player) {
        if (game.phase !== 'day') {
            alert('A Bala Mágica só pode ser usada durante o Dia!');
            return;
        }
        if (game.balaMagicaUsed[player.name]) {
            alert('Você já usou sua Bala Mágica nesta partida!');
            return;
        }

        const targets = getAlivePlayers().filter(p => p.name !== player.name);
        if (!targets.length) {
            alert('Não há outros jogadores vivos para atingir.');
            return;
        }

        showTargetSelection(
            '🔫 Bala Mágica',
            'Escolha quem você deseja eliminar com o disparo.',
            targets,
            target => {
                game.balaMagicaUsed[player.name] = true;
                addLog(`🔫 ${player.name} usou a Bala Mágica em ${target.name}!`);
                killPlayer(target, 'Bala Mágica', true, false, false);
                checkWinCondition();
                renderPlayerProfile(player.name);
                updateAlivePlayersGrid();
                updateGraveyard();
            }
        );
    }

    function startRoletaRussaDuel(player, target) {
        consumeItem(player, 'roleta');
        closePlayerProfile();

        const mainCard = document.getElementById('gameMainCard');
        let playerNumbers = [];

        mainCard.innerHTML = `
            <div style="text-align:center;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:10px;">
                <div style="font-size:2em;">🎰</div>
                <div style="font-weight:700;font-family:var(--font-serif);font-size:0.9em;">Roleta Russa: Duelo Mortal</div>
                <div style="color:var(--accent);font-size:0.8em;font-weight:600;">
                    ${player.name} VS ${target.name}
                </div>
                <div style="color:var(--text-muted);font-size:0.7em;margin-top:2px;">
                    ${player.name}, selecione 3 números. Os restantes serão de ${target.name}.
                </div>
            </div>

            <div class="dice-scene">
                <div class="dice-cube" id="diceCube">
                    <div class="dice-face face-1">1</div>
                    <div class="dice-face face-2">2</div>
                    <div class="dice-face face-3">3</div>
                    <div class="dice-face face-4">4</div>
                    <div class="dice-face face-5">5</div>
                    <div class="dice-face face-6">6</div>
                </div>
            </div>

            <div id="diceStatus" style="text-align:center;font-size:0.75em;color:var(--accent);font-weight:700;min-height:20px;">
                Selecione 3 números (0/3)
            </div>

            <div class="number-selector-grid" id="diceNumberGrid">
                <button class="number-btn" data-num="1">1</button>
                <button class="number-btn" data-num="2">2</button>
                <button class="number-btn" data-num="3">3</button>
                <button class="number-btn" data-num="4">4</button>
                <button class="number-btn" data-num="5">5</button>
                <button class="number-btn" data-num="6">6</button>
            </div>

            <div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.2);padding:8px;border:1px solid var(--border);border-radius:var(--radius);font-size:0.7em;margin-bottom:10px;">
                <div><strong>${player.name}:</strong> <span id="p1Nums" style="color:var(--accent);">-</span></div>
                <div><strong>${target.name}:</strong> <span id="p2Nums" style="color:#d65d5d;">-</span></div>
            </div>

            <button class="btn btn-primary" id="btnRollDice" disabled>Girar o Dado</button>
        `;

        const numberButtons = mainCard.querySelectorAll('.number-btn');
        const btnRoll = document.getElementById('btnRollDice');
        const p1Nums = document.getElementById('p1Nums');
        const p2Nums = document.getElementById('p2Nums');
        const diceStatus = document.getElementById('diceStatus');
        const diceCube = document.getElementById('diceCube');

        numberButtons.forEach(btn => {
            btn.onclick = () => {
                const num = parseInt(btn.dataset.num);
                if (playerNumbers.includes(num)) {
                    playerNumbers = playerNumbers.filter(n => n !== num);
                    btn.classList.remove('selected');
                } else {
                    if (playerNumbers.length < 3) {
                        playerNumbers.push(num);
                        btn.classList.add('selected');
                    }
                }

                playerNumbers.sort((a,b) => a - b);
                p1Nums.textContent = playerNumbers.length ? playerNumbers.join(', ') : '-';

                const targetNumbers = [1,2,3,4,5,6].filter(n => !playerNumbers.includes(n));
                p2Nums.textContent = playerNumbers.length === 3 ? targetNumbers.join(', ') : '-';
                diceStatus.textContent = `Selecione 3 números (${playerNumbers.length}/3)`;

                btnRoll.disabled = playerNumbers.length !== 3;
            };
        });

        btnRoll.onclick = () => {
            btnRoll.disabled = true;
            numberButtons.forEach(b => b.disabled = true);
            diceStatus.textContent = '🎲 O dado está rolando...';
            diceCube.className = 'dice-cube rolling';

            const rolledNumber = Math.floor(Math.random() * 6) + 1;

            setTimeout(() => {
                diceCube.className = `dice-cube dice-show-${rolledNumber}`;
                const loser = playerNumbers.includes(rolledNumber) ? player : target;
                const winner = loser.name === player.name ? target : player;

                diceStatus.innerHTML = `🎯 Número sorteado: <strong>${rolledNumber}</strong>!`;

                setTimeout(() => {
                    const bounty = loser.coins || 0;
                    winner.coins = (winner.coins || 0) + bounty;
                    loser.coins = 0;

                    killPlayer(loser, `Roleta Russa (Caiu ${rolledNumber})`, true, false, true);
                    addLog(`🎰 Roleta Russa: Caiu ${rolledNumber}. ${loser.name} morreu e entregou ${bounty} 🪙 para ${winner.name}.`);

                    mainCard.innerHTML = `
                        <div class="result-banner result-death" style="margin-top:8px;">
                            💥 O dado caiu em <strong>${rolledNumber}</strong>!<br>
                            <strong>${loser.name}</strong> foi eliminado.<br>
                            <strong>${winner.name}</strong> recebeu ${bounty} moedas!
                        </div>
                        <button class="btn btn-primary" id="btnContinueAfterDice" style="margin-top:8px;">Continuar Jogo</button>
                    `;

                    document.getElementById('btnContinueAfterDice').onclick = () => {
                        checkWinCondition();
                        renderGame();
                    };

                    updateAlivePlayersGrid();
                    updateGraveyard();
                }, 1400);
            }, 1800);
        };
    }

    function openPlayerProfile(playerName) {
        game.profilePlayer = playerName;
        renderPlayerProfile(playerName);
        const panel = document.getElementById('playerProfilePanel');
        panel.style.display = '';
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closePlayerProfile() {
        game.profilePlayer = null;
        document.getElementById('playerProfilePanel').style.display = 'none';
    }

    function renderPlayerProfile(playerName) {
        const player = getPlayerByName(playerName);
        if (!player) return;

        const panel = document.getElementById('playerProfilePanel');
        panel.style.display = '';

        const isLeader = game.players.length > 0 && game.players[0].name === player.name;

        const inventoryHtml = player.inventory.length
            ? player.inventory.map(itemId => {
                const item = ITEM_DEFS[itemId];
                return `<span title="${item.name}">${item.icon}</span>`;
            }).join('')
            : `<span style="color:var(--text-muted);font-size:0.7em;">Nenhum item</span>`;

        let subclassActionsHtml = '';
        if (player.alive && game.phase === 'day') {

                <span>🪙 Moedas</span>
                <span class="profile-stat-value">${player.coins || 0}</span>
            </div>

            <div class="profile-stat">
                <span>🎒 Itens</span>
                <span class="inventory-mini">${inventoryHtml}</span>
            </div>

            ${subclassActionsHtml}

            <div class="section-title">👑 Gerenciamento do Líder</div>
            <div class="management-grid">
                <button class="btn btn-success" id="coinPlus5">🪙 +5</button>
                <button class="btn btn-success" id="coinPlus1">🪙 +1</button>
                <button class="btn btn-danger" id="coinMinus1">🪙 -1</button>
                <button class="btn btn-danger" id="coinMinus5">🪙 -5</button>
            </div>

            <div class="section-title">❤️ Gerenciar Vida</div>
            <div class="management-grid">
                <button class="btn btn-success" id="revivePlayerBtn" ${player.alive ? 'disabled' : ''}>❤️ REVIVER</button>
                <button class="btn btn-danger" id="killPlayerBtn" ${!player.alive ? 'disabled' : ''}>☠️ MATAR</button>

            ${game.phase === 'day' ? renderStore(player) : `<div class="section-title">🏪 Loja</div><div class="item-use-note">🌙 A loja só fica disponível durante o Dia.</div>`}

        document.getElementById('closeProfileBtn').onclick = closePlayerProfile;

        if (document.getElementById('btnShootBalaMagica')) {

        document.getElementById('coinPlus1').onclick = () => changeCoins(player, 1);
        document.getElementById('coinMinus1').onclick = () => changeCoins(player, -1);
        document.getElementById('coinMinus5').onclick = () => changeCoins(player, -5);

        document.getElementById('killPlayerBtn').onclick = () => manualKill(player);
