<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade Dorme - O Jogo da Noite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #18161a;
            --bg-card: #242126;
            --bg-input: #2d2a30;
            --text: #efe7dd;
            --text-muted: #8a8075;
            --accent: #c4a06c;
            --accent-dim: #c4a06c20;
            --border: #423b34;
            --radius: 4px;
            --font-serif: 'Cinzel', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(80, 60, 40, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(40, 30, 20, 0.4) 0%, transparent 50%);
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .header-brand {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            border-bottom: 2px double var(--border);
            padding-bottom: 20px;
        }
        .header-brand::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: var(--accent);
        }
        .moon-icon {
            font-size: 70px;
            display: block;
            color: var(--text);
            filter: drop-shadow(0 0 20px rgba(196, 160, 108, 0.2));
            margin-bottom: -10px;
        }
        .logo-title {
            font-family: var(--font-serif);
            font-size: 3em;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--text);
            text-transform: uppercase;
            margin: 0;
            line-height: 1;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
        }
        .logo-title span { font-weight: 900; font-style: italic; color: var(--accent); }
        .logo-subtitle {
            font-size: 0.6em;
            color: var(--text-muted);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 8px;
            font-weight: 300;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            display: inline-block;
        }

        .screen { display: none; animation: fadeSlide 0.5s ease; }
        .screen.active { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
        }
        h2 {
            font-family: var(--font-serif);
            font-size: 1.1em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .player-count-input-container { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .player-count-input {
            width: 80px; padding: 12px;
            background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text); font-size: 1.4em; font-weight: 700;
            text-align: center; outline: none;
            font-family: var(--font-serif);
            border-radius: var(--radius);
        }
        .player-count-input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(196, 160, 108, 0.2); }

        .role-toggles { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .role-toggle {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; border: 1px solid transparent;
            border-radius: var(--radius); cursor: pointer;
            transition: 0.3s ease; background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
        }
        .role-toggle:last-child { border-bottom: none; }
        .role-toggle:hover { background: rgba(196, 160, 108, 0.05); }
        .role-toggle.active { border-color: var(--accent); background: var(--accent-dim); }
        .role-toggle.disabled { opacity: 0.4; cursor: default; pointer-events: none; }
        .role-toggle-icon { font-size: 1.5em; width: 35px; text-align: center; }
        .role-toggle-info { flex: 1; }
        .role-toggle-name { font-size: 0.95em; font-weight: 600; color: var(--text); }
        .role-toggle-desc { font-size: 0.75em; color: var(--text-muted); }
        .role-toggle-badge {
            font-size: 0.6em; padding: 4px 10px; border-radius: 20px;
            font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            border: 1px solid var(--border); color: var(--text-muted);
        }
        .badge-on { border-color: var(--accent); color: var(--accent); }
        .badge-locked { border-color: #555; color: #555; background: #222; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 14px 32px; border-radius: var(--radius);
            font-size: 0.85em; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; border: 1px solid var(--border);
            transition: 0.3s ease; width: 100%;
            font-family: var(--font-serif); background: transparent; color: var(--text);
            box-shadow: inset 0 0 0 0 var(--accent);
        }
        .btn-primary {
            background: var(--accent); color: #18161a;
            border: 1px solid var(--accent);
        }
        .btn-primary:hover { background: #d4b07c; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(196, 160, 108, 0.3); }
        .btn-danger {
            background: transparent; color: #d65d5d;
            border: 1px solid rgba(214, 93, 93, 0.3);
        }
        .btn-danger:hover { background: rgba(214, 93, 93, 0.1); border-color: #d65d5d; }
        .btn-secondary {
            background: transparent; color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { color: var(--text); border-color: #666; }
        .btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; filter: grayscale(0.5); }

        .name-input-group {
            display: flex; align-items: center; gap: 12px;
            background: var(--bg-input); border: 1px solid var(--border);
            padding: 0 14px; border-radius: var(--radius);
            transition: 0.3s ease; margin-bottom: 10px;
        }
        .name-input-group:focus-within { border-color: var(--accent); }
        .name-input-num { color: var(--text-muted); font-size: 0.8em; font-weight: 700; font-family: var(--font-serif); }
        .name-input-group input {
            flex: 1; background: transparent; border: none;
            color: var(--text); font-size: 0.95em; padding: 12px 0; outline: none;
            font-family: var(--font-sans);
        }
        .name-input-group input::placeholder { color: #444; }

        .reveal-card {
            text-align: center; padding: 40px 20px; min-height: 280px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid var(--border); cursor: pointer;
            transition: 0.3s ease; background: rgba(0,0,0,0.3);
            border-radius: var(--radius);
            position: relative;
        }
        .reveal-card::before {
            content: '';
            position: absolute; inset: 4px; border: 1px solid var(--border); pointer-events: none;
        }
        .reveal-card.revealed { border-color: var(--accent); }
        .reveal-card.revealed::before { border-color: var(--accent); }
        .reveal-icon { font-size: 60px; margin-bottom: 16px; }
        .reveal-text { color: var(--text-muted); font-size: 0.9em; letter-spacing: 2px; }
        .reveal-role-name { font-family: var(--font-serif); font-size: 2em; font-weight: 700; letter-spacing: 2px; }
        .reveal-sub-name { font-size: 1em; color: var(--text-muted); margin-top: 4px; font-style: italic; }
        .reveal-role-desc { color: var(--text-muted); font-size: 0.85em; margin-top: 6px; line-height: 1.4; }

        .game-phase-indicator {
            text-align: center; padding: 12px;
            border: 1px solid var(--border); background: var(--bg-card);
            font-weight: 700; text-transform: uppercase; letter-spacing: 4px;
            font-size: 0.75em; margin-bottom: 20px; color: var(--text-muted);
            font-family: var(--font-serif);
        }
        .phase-night { color: #9ea0c0; border-color: #3a3a55; }
        .phase-day { color: var(--accent); border-color: var(--accent-dim); }

        .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
        .player-chip {
            display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            background: rgba(255,255,255,0.02); border: 1px solid transparent;
            cursor: pointer; font-size: 0.85em; border-radius: var(--radius);
            transition: 0.3s ease;
        }
        .player-chip:hover { background: rgba(255,255,255,0.05); border-color: var(--border); }
        .player-chip.selected { border-color: var(--accent); background: var(--accent-dim); }
        .player-chip.dead { opacity: 0.3; text-decoration: line-through; pointer-events: none; }
        .chip-icon { width: 25px; text-align: center; font-size: 1.1em; }

        .graveyard { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .graveyard-chip {
            font-size: 0.65em; padding: 2px 8px; background: rgba(0,0,0,0.6);
            color: #666; border: 1px solid #2a2a2a; border-radius: 2px;
        }

        .result-banner {
            padding: 14px; border: 1px solid var(--border);
            margin-bottom: 12px; text-align: center; font-size: 0.9em;
            background: rgba(0,0,0,0.3);
        }
        .result-death { border-color: rgba(214, 93, 93, 0.4); color: #d65d5d; }
        .result-safe { border-color: rgba(84, 204, 125, 0.4); color: #80dba0; }
        .result-info { border-color: rgba(196, 160, 108, 0.4); color: var(--accent); }
        .result-bomb-win { border-color: #c07830; color: #e09940; font-weight: 700; }

        .game-log {
            max-height: 150px; overflow-y: auto; padding: 8px;
            background: rgba(0,0,0,0.4); font-size: 0.7em; color: var(--text-muted);
            line-height: 1.6; border: 1px solid var(--border);
            font-family: var(--font-sans);
        }
        .log-entry { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .log-entry:last-child { border-bottom: none; }

        .gameover-card { text-align: center; padding: 40px 20px; }
        .gameover-icon { font-size: 80px; display: block; margin-bottom: 10px; }
        .gameover-title { font-family: var(--font-serif); font-size: 2.5em; margin: 10px 0; letter-spacing: 2px; }
        .gameover-subtitle { color: var(--text-muted); font-size: 0.9em; margin-bottom: 30px; line-height: 1.6; }

        @media (max-width: 400px) {
            .logo-title { font-size: 2.2em; letter-spacing: 3px; }
            .player-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="header-brand">
            <span class="moon-icon">🌙</span>
            <div class="logo-title"><span>Cidade</span> Dorme</div>
            <div class="logo-subtitle">O Jogo da Noite</div>
        </div>

        <div class="screen active" id="screen-setup">
            <div class="card">
                <h2>+ Configuração</h2>
                <div class="player-count-input-container">
                    <label style="color:var(--text-muted);font-size:0.8em;letter-spacing:2px;text-transform:uppercase;">Participantes (5-12)</label>
                    <input type="number" class="player-count-input" id="playerCountInput" min="5" max="12" value="6">
                </div>
            </div>

            <div class="card">
                <h2>Subclasses (Únicas)</h2>
                <div class="role-toggles" id="subclassToggles"></div>
                
                <div style="display:flex; gap:10px; margin-top:12px;">
                    <button class="btn btn-secondary" id="btnRandomizeSubs" style="flex:1;">🎲 Sortear</button>
                </div>
                
                <div style="text-align:center;color:var(--text-muted);font-size:0.75em;margin-top:12px;border-top:1px solid var(--border);padding-top:12px;" id="roleSummary"></div>
            </div>

            <button class="btn btn-primary" id="btnStartSetup">Distribuir Funções</button>
        </div>

        <div class="screen" id="screen-names">
            <div class="card">
                <h2>Jogadores</h2>
                <p style="color:var(--text-muted);font-size:0.8em;margin-bottom:16px;text-align:center;letter-spacing:1px;">Nomeie cada participante.</p>
                <div class="name-inputs" id="nameInputs"></div>
                <button class="btn btn-primary" id="btnDistributeRoles">Iniciar Jogo</button>
                <button class="btn btn-secondary" style="margin-top:8px;" id="btnBackToSetup">← Voltar</button>
            </div>
        </div>

        <div class="screen" id="screen-reveal">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; color:var(--text-muted); font-size:0.7em; text-transform:uppercase; letter-spacing:2px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                    <span>Jogador <span id="revealPlayerNum" style="color:var(--accent);">1</span></span>
                    <span id="revealProgress">0 / 0</span>
                </div>
                <div style="text-align:center;font-size:1.3em;font-weight:600;margin-bottom:20px;border:1px solid var(--border);padding:8px;background:rgba(0,0,0,0.2);" id="revealPlayerName">—</div>
                
                <div class="reveal-card" id="revealCard">
                    <span class="reveal-icon">🃏</span>
                    <span class="reveal-text">Toque para ver seu destino</span>
                    <div class="reveal-role-name" style="display:none;" id="revealRoleName"></div>
                    <div class="reveal-sub-name" style="display:none;" id="revealSubName"></div>
                    <div class="reveal-role-desc" style="display:none;" id="revealRoleDesc"></div>
                </div>
                
                <button class="btn btn-primary" id="btnNextReveal" style="margin-top:16px;display:none;">Próximo</button>
                <button class="btn btn-primary" id="btnStartGameAfterReveal" style="margin-top:16px;display:none;">A Noite Começa</button>
            </div>
        </div>

        <div class="screen" id="screen-game">
            <div class="game-phase-indicator phase-night" id="phaseIndicator">🌙 Noite — Rodada 0</div>

            <div class="card" id="gameMainCard"></div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:12px;">
                    <span style="font-size:0.7em; text-transform:uppercase; letter-spacing:2px; color:var(--text-muted);">Vivos</span>
                    <span style="font-size:0.7em; text-transform:uppercase; letter-spacing:2px; color:var(--text-muted);">🪦 Cemitério</span>
                </div>
                <div style="display:flex; gap:20px; flex-wrap:wrap;">
                    <div style="flex:1; min-width:140px;">
                        <div class="player-grid" id="alivePlayersGrid" style="grid-template-columns:1fr;"></div>
                    </div>
                    <div style="flex:1; min-width:140px;">
                        <div class="graveyard" id="graveyard" style="flex-direction:column; gap:2px;"></div>
                    </div>
                </div>
                <div class="mudo-banner" id="mudoBanner" style="display:none; margin-top:12px; padding:8px; background:rgba(255,255,255,0.02); border:1px solid var(--border); text-align:center; font-size:0.8em; color:var(--text-muted);"></div>
            </div>

            <div class="card" style="padding:12px;">
                <details>
                    <summary style="cursor:pointer;font-size:0.75em;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;">📜 Histórico</summary>
                    <div class="game-log" id="gameLog" style="margin-top:8px;"></div>
                </details>
            </div>
        </div>

        <div class="screen" id="screen-gameover">
            <div class="card gameover-card">
                <span class="gameover-icon" id="gameoverIcon">🏆</span>
                <div class="gameover-title" id="gameoverTitle">Fim de Jogo</div>
                <div class="gameover-subtitle" id="gameoverSubtitle">O destino foi decidido.</div>
                <button class="btn btn-primary" id="btnRestart">Nova Partida</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const CLASS_DEFS = {
                assassino: { name: 'Assassino', icon: '🔪', team: 'assassino', desc: 'Mate todos os cidadãos.' },
                medico: { name: 'Médico', icon: '💊', team: 'cidadao', desc: 'Pode salvar uma pessoa por noite.' },
                detetive: { name: 'Detetive', icon: '🔍', team: 'cidadao', desc: 'Investiga uma pessoa por noite.' },
                cidadao: { name: 'Cidadão', icon: '👤', team: 'cidadao', desc: 'Vote para descobrir o Assassino.' }
            };

            const SUBCLASS_DEFS = {
                // Exclusivas do Assassino
                eletricista: { name: 'Eletricista', icon: '⚡', restrictedTo: 'assassino', desc: 'Apagão: Médico não salva. Votação é cancelada.' },
                mudo: { name: 'Mudo', icon: '🤫', restrictedTo: 'assassino', desc: 'Silencia um jogador na noite (não pode ser votado).' },
                detetive_corrupto: { name: 'Detetive Corrupto', icon: '🔍', restrictedTo: 'assassino', desc: 'Investiga 2 vezes na partida (vê a classe).' },
                
                // Exclusiva de Cidadãos (inclui Médico e Detetive)
                vingador: { name: 'Vingador', icon: '⚔️', restrictedTo: 'cidadao', desc: 'Se morto (não votado), leva alguém junto.' },
                
                // Universais (para todos)
                amante: { name: 'Amante', icon: '💘', restrictedTo: 'universal', desc: 'Conectado a outro jogador. Um morre, o outro morre. (Vem em dupla)' },
                prefeito: { name: 'Prefeito', icon: '🏛️', restrictedTo: 'universal', desc: 'Voto vale por 2.' },
                bala_magica: { name: 'Bala Mágica', icon: '🔫', restrictedTo: 'universal', desc: 'Uma bala que mata qualquer um (uso único).' },
                bomba: { name: 'Bomba', icon: '💣', restrictedTo: 'universal', desc: 'Se votado, explode e vence o jogo!' }
            };

            const screens = {
                setup: document.getElementById('screen-setup'),
                names: document.getElementById('screen-names'),
                reveal: document.getElementById('screen-reveal'),
                game: document.getElementById('screen-game'),
                gameover: document.getElementById('screen-gameover'),
            };

            function showScreen(name) {
                Object.values(screens).forEach(s => s.classList.remove('active'));
                screens[name].classList.add('active');
            }

            let game = {
                playerCount: 6,
                selectedSubclasses: [],
                players: [],
                currentRevealIndex: 0,
                revealed: false,
                phase: 'setup',
                nightStep: 0,
                dayStep: 0,
                nightTargets: {},
                lastSavedPlayer: null,
                mutedPlayer: null,
                eliminatedTonight: [],
                savedTonight: null,
                gameLog: [],
                round: 0,
                winner: null,
                pendingVingadorRevenge: false,
                isBlackout: false,
                detetiveUses: {},
                eletricistaUsed: false,
                balaMagicaUsed: false,
                lovers: [],
                amanteDeathTriggered: false,
            };

            function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

            function getAlivePlayers() { return game.players.filter(p => p.alive); }
            function getDeadPlayers() { return game.players.filter(p => !p.alive); }
            function getPlayerByRole(role) { return game.players.find(p => p.role === role && p.alive); }
            function getAssassino() { return getPlayerByRole('assassino'); }
            function getMedico() { return getPlayerByRole('medico'); }
            function getMudo() { return game.players.find(p => p.subclass === 'mudo' && p.alive); }
            function getEletricista() { return game.players.find(p => p.subclass === 'eletricista' && p.alive); }
            function getAmantes() { return game.players.filter(p => p.subclass === 'amante' && p.alive); }

            function addLog(msg) {
                game.gameLog.push(`[Rodada ${game.round}] ${msg}`);
                if (game.gameLog.length > 50) game.gameLog.shift();
            }

            function checkWinCondition() {
                const alive = getAlivePlayers();
                const assassinos = alive.filter(p => p.role === 'assassino');
                const cidadaos = alive.filter(p => p.role !== 'assassino');
                const amantesVivos = alive.filter(p => p.subclass === 'amante');
                
                if (assassinos.length > 0 && cidadaos.length === 0) {
                    game.winner = 'assassino';
                    game.phase = 'gameover';
                    endGame();
                    return true;
                }

                if (assassinos.length === 0 && cidadaos.length > 0) {
                    game.winner = 'cidadaos';
                    game.phase = 'gameover';
                    endGame();
                    return true;
                }

                if (amantesVivos.length > 0 && assassinos.length > 0 && cidadaos.length === 0) {
                    game.winner = 'amantes';
                    game.phase = 'gameover';
                    endGame();
                    return true;
                }

                return false;
            }

            function killPlayer(player, cause, triggerVingador = true, isVote = false) {
                if (!player.alive) return;
                player.alive = false;
                addLog(`${player.name} (${CLASS_DEFS[player.role].name}${player.subclass ? ' - ' + SUBCLASS_DEFS[player.subclass].name : ''}) foi eliminado(a) — ${cause}`);

                if (game.lovers.includes(player.name)) {
                    const otherLover = game.players.find(p => p.subclass === 'amante' && p.alive && p.name !== player.name);
                    if (otherLover && !game.amanteDeathTriggered) {
                        game.amanteDeathTriggered = true;
                        addLog(`💘 ${player.name} morreu. ${otherLover.name} também sente a dor...`);
                        killPlayer(otherLover, 'Amante (Morte Conectada)', false, false);
                        game.amanteDeathTriggered = false;
                    }
                }

                if (triggerVingador && player.subclass === 'vingador' && !isVote && player.role !== 'assassino') {
                    triggerVingadorRevenge(player);
                }
            }

            function triggerVingadorRevenge(vingadorPlayer) {
                const aliveOthers = getAlivePlayers().filter(p => p.name !== vingadorPlayer.name);
                if (aliveOthers.length === 0) return;

                game.pendingVingadorRevenge = true;
                const mainCard = document.getElementById('gameMainCard');
                mainCard.innerHTML = `
                    <div style="text-align:center; padding:20px; border:1px solid var(--border); margin-bottom:16px; background:rgba(0,0,0,0.3);">
                        <div style="font-size:2.5em;">⚔️</div>
                        <div style="font-weight:700; margin:4px 0; font-family:var(--font-serif);">Vingança!</div>
                        <div style="color:var(--text-muted); font-size:0.85em;">${vingadorPlayer.name} foi morto e pode levar alguém junto.</div>
                    </div>
                    <div class="player-grid" id="vingadorRevengeGrid" style="grid-template-columns:1fr;"></div>
                    <button class="btn btn-danger" id="btnConfirmRevenge" disabled>Confirmar Vingança</button>
                    <button class="btn btn-secondary" style="margin-top:8px;" id="btnSkipRevenge">Perdoar</button>
                `;

                const grid = document.getElementById('vingadorRevengeGrid');
                const btn = document.getElementById('btnConfirmRevenge');
                let selected = null;

                aliveOthers.forEach(p => {
                    const chip = document.createElement('div');
                    chip.className = 'player-chip';
                    chip.innerHTML = `<span class="chip-icon">${CLASS_DEFS[p.role].icon}</span> ${p.name}`;
                    chip.onclick = () => {
                        grid.querySelectorAll('.player-chip').forEach(c => c.classList.remove('selected'));
                        chip.classList.add('selected');
                        selected = p.name; btn.disabled = false;
                    };
                    grid.appendChild(chip);
                });

                btn.onclick = () => {
                    if (!selected) return;
                    const target = game.players.find(p => p.name === selected && p.alive);
                    if (target) {
                        killPlayer(target, 'Vingança', false, false);
                        addLog(`⚔️ ${vingadorPlayer.name} levou ${target.name} junto!`);
                    }
                    game.pendingVingadorRevenge = false;
                    if (checkWinCondition()) return;
                    if (game.phase === 'night') { game.nightStep++; renderGame(); } 
                    else if (game.phase === 'day') proceedToNextNight();
                };
                
                document.getElementById('btnSkipRevenge').onclick = () => {
                    game.pendingVingadorRevenge = false;
                    if (game.phase === 'night') { game.nightStep++; renderGame(); } 
                    else if (game.phase === 'day') proceedToNextNight();
                };
                updateAlivePlayersGrid(); updateGraveyard();
            }

            function renderSetup() {
                game.playerCount = 6; game.selectedSubclasses = [];
                game.players = []; game.currentRevealIndex = 0; game.revealed = false;
                game.phase = 'setup'; game.nightStep = 0; game.dayStep = 0;
                game.nightTargets = {}; game.lastSavedPlayer = null; game.mutedPlayer = null;
                game.eliminatedTonight = []; game.savedTonight = null; game.gameLog = [];
                game.round = 0; game.winner = null; game.pendingVingadorRevenge = false;
                game.isBlackout = false;
                game.detetiveUses = {}; game.eletricistaUsed = false; game.balaMagicaUsed = false;
                game.lovers = []; game.amanteDeathTriggered = false;

                const input = document.getElementById('playerCountInput');
                input.value = 6;
                input.oninput = function() {
                    let val = parseInt(this.value);
                    if (isNaN(val) || val < 5) val = 5; if (val > 12) val = 12;
                    game.playerCount = val; this.value = val;
                    updateSubclassToggles(); updateRoleSummary();
                };
                updateSubclassToggles(); updateRoleSummary();
                
                document.getElementById('btnRandomizeSubs').onclick = () => {
                    const allSubs = Object.keys(SUBCLASS_DEFS);
                    const shuffled = shuffleArray(allSubs);
                    let selected = [];
                    let availableSlots = Math.min(game.playerCount, shuffled.length);
                    
                    for(let i=0; i<availableSlots; i++) {
                        let sub = shuffled[i];
                        if (sub === 'amante') {
                            // Se amante for sorteado, ele ocupa 2 slots
                            if (i + 1 < availableSlots) {
                                selected.push('amante');
                                selected.push('amante'); // Adiciona o segundo amante
                                i++; // Pula o próximo slot
                            }
                        } else {
                            selected.push(sub);
                        }
                    }
                    game.selectedSubclasses = selected;
                    updateSubclassToggles(); updateRoleSummary();
                };

                document.getElementById('btnStartSetup').onclick = () => {
                    if (game.playerCount < 5 || game.playerCount > 12) return alert('Mínimo 5 jogadores.');

                    let classes = [];
                    classes.push('assassino', 'medico', 'detetive');
                    let cidadaoCount = game.playerCount - 3;
                    for(let i=0; i<cidadaoCount; i++) classes.push('cidadao');
                    classes = shuffleArray(classes);
                    
                    let subMap = new Array(game.playerCount).fill(null);
                    let availableSubs = shuffleArray([...game.selectedSubclasses]);
                    let subIndex = 0;
                    
                    for(let i=0; i<game.playerCount; i++) {
                        if (subIndex < availableSubs.length) {
                            let subclass = availableSubs[subIndex];
                            let def = SUBCLASS_DEFS[subclass];
                            
                            // Verifica restrição
                            // Se for 'assassino', só pode receber as restritas a ele
                            // Se for 'cidadao', 'medico' ou 'detetive', pode receber 'cidadao' ou 'universal'
                            if (classes[i] === 'assassino') {
                                if (def.restrictedTo !== 'assassino') {
                                    // Tenta achar uma subclasse que sirva para assassino
                                    let found = false;
                                    for(let j=subIndex+1; j<availableSubs.length; j++) {
                                        let altSub = availableSubs[j];
                                        let altDef = SUBCLASS_DEFS[altSub];
                                        if (altDef.restrictedTo === 'assassino') {
                                            [availableSubs[subIndex], availableSubs[j]] = [availableSubs[j], availableSubs[subIndex]];
                                            found = true;
                                            break;
                                        }
                                    }
                                    if (!found) {
                                        subIndex++;
                                        continue;
                                    }
                                }
                            } else {
                                // Médico, Detetive ou Cidadão (não é assassino)
                                if (def.restrictedTo === 'assassino') {
                                    // Se a subclasse for apenas de assassino, pula
                                    let found = false;
                                    for(let j=subIndex+1; j<availableSubs.length; j++) {
                                        let altSub = availableSubs[j];
                                        let altDef = SUBCLASS_DEFS[altSub];
                                        if (altDef.restrictedTo !== 'assassino') {
                                            [availableSubs[subIndex], availableSubs[j]] = [availableSubs[j], availableSubs[subIndex]];
                                            found = true;
                                            break;
                                        }
                                    }
                                    if (!found) {
                                        subIndex++;
                                        continue;
                                    }
                                }
                            }
                            
                            subMap[i] = availableSubs[subIndex];
                            subIndex++;
                        }
                    }

                    game.selectedClasses = classes;
                    game.selectedSubclasses = subMap;
                    
                    game.phase = 'names'; renderNames(); showScreen('names');
                };
                showScreen('setup');
            }

            function updateSubclassToggles() {
                const container = document.getElementById('subclassToggles'); container.innerHTML = '';
                
                // Categorias para organizar visualmente
                const categories = {
                    '🔪 Exclusivas do Assassino': ['eletricista', 'mudo', 'detetive_corrupto'],
                    '👤 Para Cidadãos, Médicos e Detetives': ['vingador'],
                    '🌍 Universais (Todos)': ['amante', 'prefeito', 'bala_magica', 'bomba']
                };

                Object.entries(categories).forEach(([categoryName, keys]) => {
                    // Adiciona um subtítulo visual
                    const subtitle = document.createElement('div');
                    subtitle.style.cssText = 'font-size: 0.8em; color: var(--text-muted); margin-top: 10px; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase;';
                    subtitle.textContent = categoryName;
                    container.appendChild(subtitle);

                    keys.forEach(key => {
                        const def = SUBCLASS_DEFS[key];
                        const isActive = game.selectedSubclasses.includes(key);
                        const div = document.createElement('div');
                        
                        div.className = `role-toggle ${isActive ? 'active' : ''}`;
                        div.innerHTML = `
                            <span class="role-toggle-icon">${def.icon}</span>
                            <div class="role-toggle-info">
                                <div class="role-toggle-name">${def.name}</div>
                                <div class="role-toggle-desc">${def.desc}</div>
                            </div>
                            <span class="role-toggle-badge ${isActive ? 'badge-on' : ''}">${isActive ? 'ATIVO' : 'INATIVO'}</span>
                        `;
                        
                        // Lógica especial para Amantes (sempre em dupla)
                        if (key === 'amante') {
                            div.onclick = () => {
                                const currentAmantes = game.selectedSubclasses.filter(s => s === 'amante').length;
                                const availableSlots = game.playerCount - game.selectedSubclasses.length + currentAmantes;
                                
                                if (isActive) {
                                    // Remove os dois amantes
                                    let newList = [...game.selectedSubclasses];
                                    let removed = 0;
                                    newList = newList.filter(s => {
                                        if (s === 'amante' && removed < 2) { removed++; return false; }
                                        return true;
                                    });
                                    game.selectedSubclasses = newList;
                                } else {
                                    // Adiciona os dois amantes se houver espaço
                                    if (availableSlots >= 2) {
                                        game.selectedSubclasses.push('amante');
                                        game.selectedSubclasses.push('amante');
                                    } else {
                                        alert('Não há espaço suficiente para uma dupla de Amantes!');
                                    }
                                }
                                updateSubclassToggles(); updateRoleSummary();
                            };
                        } else {
                            div.onclick = () => {
                                if (isActive) game.selectedSubclasses = game.selectedSubclasses.filter(r => r !== key);
                                else game.selectedSubclasses.push(key);
                                updateSubclassToggles(); updateRoleSummary();
                            };
                        }
                        
                        container.appendChild(div);
                    });
                });
            }

            function updateRoleSummary() {
                const summary = document.getElementById('roleSummary');
                let parts = [];
                if(game.selectedSubclasses.length > 0) {
                    // Conta os amantes para exibir corretamente
                    const counts = {};
                    game.selectedSubclasses.forEach(s => counts[s] = (counts[s] || 0) + 1);
                    const displayList = Object.keys(counts).map(key => {
                        if (key === 'amante') return `${SUBCLASS_DEFS[key].icon} (x${counts[key]})`;
                        return SUBCLASS_DEFS[key].icon;
                    });
                    parts.push(`Subclasses: ${displayList.join(' ')}`);
                }
                summary.textContent = `Total: ${game.playerCount} jog. | ${parts.join(' | ')}`;
            }

            function renderNames() {
                const container = document.getElementById('nameInputs'); container.innerHTML = '';
                for (let i = 0; i < game.playerCount; i++) {
                    const group = document.createElement('div'); group.className = 'name-input-group';
                    group.innerHTML = `<span class="name-input-num">#${i+1}</span><input type="text" placeholder="Nome ${i+1}" data-index="${i}" maxlength="20">`;
                    container.appendChild(group);
                }
                document.getElementById('btnDistributeRoles').onclick = () => {
                    const inputs = container.querySelectorAll('input');
                    const names = Array.from(inputs).map((inp, i) => inp.value.trim() || `Jogador ${i+1}`);
                    
                    game.players = names.map((n, i) => ({ 
                        name: n, 
                        role: game.selectedClasses[i % game.selectedClasses.length], 
                        subclass: game.selectedSubclasses[i % game.selectedSubclasses.length],
                        alive: true 
                    }));

                    const amantes = game.players.filter(p => p.subclass === 'amante');
                    if (amantes.length >= 2) {
                        game.lovers = [amantes[0].name, amantes[1].name];
                        addLog(`💘 ${amantes[0].name} e ${amantes[1].name} estão apaixonados!`);
                    }

                    game.players.filter(p => p.subclass === 'detetive_corrupto').forEach(p => {
                        game.detetiveUses[p.name] = 2;
                    });

                    game.currentRevealIndex = 0; game.revealed = false; game.phase = 'reveal';
                    renderReveal(); showScreen('reveal');
                };
                document.getElementById('btnBackToSetup').onclick = () => { game.phase = 'setup'; renderSetup(); };
            }

            function renderReveal() {
                const idx = game.currentRevealIndex; const player = game.players[idx];
                document.getElementById('revealPlayerNum').textContent = idx + 1;
                document.getElementById('revealPlayerName').textContent = player.name;
                document.getElementById('revealProgress').textContent = `${idx + 1} / ${game.players.length}`;

                const card = document.getElementById('revealCard'); card.classList.remove('revealed');
                card.querySelector('.reveal-icon').textContent = '🃏'; card.querySelector('.reveal-icon').style.display = '';
                card.querySelector('.reveal-text').textContent = 'Toque para ver seu destino'; card.querySelector('.reveal-text').style.display = '';
                card.querySelector('.reveal-role-name').style.display = 'none'; card.querySelector('.reveal-sub-name').style.display = 'none';
                card.querySelector('.reveal-role-desc').style.display = 'none';
                document.getElementById('btnNextReveal').style.display = 'none'; document.getElementById('btnStartGameAfterReveal').style.display = 'none';
                game.revealed = false;

                card.onclick = () => {
                    if (game.revealed) return; game.revealed = true;
                    const defC = CLASS_DEFS[player.role];
                    const defS = player.subclass ? SUBCLASS_DEFS[player.subclass] : null;
                    
                    card.classList.add('revealed'); 
                    card.querySelector('.reveal-icon').textContent = defC.icon;
                    card.querySelector('.reveal-text').style.display = 'none';
                    
                    const rn = card.querySelector('.reveal-role-name'); 
                    rn.textContent = `${defC.name} ${defS ? '· ' + defS.icon : ''}`; 
                    rn.style.display = ''; 
                    rn.style.color = defC.team === 'assassino' ? '#d65d5d' : '#80dba0';
                    
                    const sn = card.querySelector('.reveal-sub-name');
                    if(defS) { sn.textContent = `Subclasse: ${defS.name}`; sn.style.display = ''; } else { sn.style.display = 'none'; }
                    
                    const rd = card.querySelector('.reveal-role-desc'); 
                    rd.innerHTML = `${defC.desc}${defS ? `<br><br>🛠️ <strong>Poder:</strong> ${defS.desc}` : ''}`;
                    rd.style.display = '';
                    
                    document.getElementById(idx < game.players.length - 1 ? 'btnNextReveal' : 'btnStartGameAfterReveal').style.display = '';
                };
                document.getElementById('btnNextReveal').onclick = () => { game.currentRevealIndex++; renderReveal(); };
                document.getElementById('btnStartGameAfterReveal').onclick = () => {
                    game.phase = 'night'; game.round = 1; game.nightStep = 0; game.nightTargets = {}; game.mutedPlayer = null;
                    game.isBlackout = false;
                    addLog('🌙 A primeira noite começa...');
                    renderGame(); showScreen('game');
                };
            }

            function renderGame() {
                updatePhaseIndicator(); updateAlivePlayersGrid(); updateGraveyard(); updateMudoBanner(); updateGameLog();
                const mainCard = document.getElementById('gameMainCard');
                if (game.phase === 'night') renderNightPhase(mainCard);
                else if (game.phase === 'day') renderDayPhase(mainCard);
            }

            function updatePhaseIndicator() {
                const el = document.getElementById('phaseIndicator');
                el.className = `game-phase-indicator ${game.phase === 'night' ? 'phase-night' : 'phase-day'}`;
                el.innerHTML = game.phase === 'night' ? `🌙 Noite — Rodada ${game.round}` : `☀️ Dia — Rodada ${game.round}`;
            }
            function updateAlivePlayersGrid() {
                const grid = document.getElementById('alivePlayersGrid'); grid.innerHTML = '';
                getAlivePlayers().forEach(p => {
                    const chip = document.createElement('div'); chip.className = 'player-chip';
                    const classIcon = CLASS_DEFS[p.role].icon;
                    const subIcon = p.subclass ? SUBCLASS_DEFS[p.subclass].icon : '';
                    chip.innerHTML = `<span class="chip-icon">${classIcon} ${subIcon}</span> ${p.name}`;
                    grid.appendChild(chip);
                });
                if (!getAlivePlayers().length) grid.innerHTML = '<span style="color:var(--text-muted);font-size:0.8em;">Nenhum vivo</span>';
            }
            function updateGraveyard() {
                const grave = document.getElementById('graveyard'); const dead = getDeadPlayers();
                grave.innerHTML = dead.length ? dead.map(p => {
                    const classIcon = CLASS_DEFS[p.role].icon;
                    const subIcon = p.subclass ? SUBCLASS_DEFS[p.subclass].icon : '';
                    return `<div class="graveyard-chip">${classIcon}${subIcon} ${p.name}</div>`;
                }).join('') : '<span style="color:#444;font-size:0.7em;">Vazio</span>';
            }
            function updateMudoBanner() {
                const banner = document.getElementById('mudoBanner');
                if (game.mutedPlayer && game.phase === 'day') {
                    const p = game.players.find(x => x.name === game.mutedPlayer && x.alive);
                    if (p) { banner.style.display = ''; banner.innerHTML = `🤫 <strong>${p.name}</strong> está mudo hoje e não pode ser votado.`; } else banner.style.display = 'none';
                } else banner.style.display = 'none';
            }
            function updateGameLog() {
                const logEl = document.getElementById('gameLog');
                logEl.innerHTML = game.gameLog.slice(-15).map(e => `<div class="log-entry">${e}</div>`).join('');
                logEl.scrollTop = logEl.scrollHeight;
            }

            function renderNightPhase(mainCard) {
                const assassino = getAssassino();
                const medico = getMedico();
                const mudo = getMudo();
                const steps = [];
                
                if (assassino) steps.push('assassino');
                if (medico && !game.isBlackout) steps.push('medico'); 
                else if (game.isBlackout) addLog('⚡ Apagão! O Médico não acordou esta noite.');
                
                const detetiveCorrupto = game.players.find(p => p.subclass === 'detetive_corrupto' && p.alive);
                if (detetiveCorrupto && game.detetiveUses[detetiveCorrupto.name] > 0) steps.push('detetive_corrupto');
                
                if (mudo) steps.push('mudo');
                steps.push('resolve');

                if (game.nightStep >= steps.length) { resolveNight(); return; }

                const role = steps[game.nightStep];
                const titles = { 
                    assassino: ['🔪', 'Assassino, escolha sua vítima.'], 
                    medico: ['💊', 'Médico, quem você protege?'], 
                    detetive_corrupto: ['🔍', 'Detetive Corrupto, quem investigar? (Usos: ' + (game.detetiveUses[detetiveCorrupto?.name] || 0) + '/2)'], 
                    mudo: ['🤫', 'Mudo, silencie alguém.'] 
                };
                
                mainCard.innerHTML = `
                    <div style="text-align:center; padding:20px 0; margin-bottom:16px; border-bottom:1px solid var(--border);">
                        <div style="font-size:2.5em;">${titles[role][0]}</div>
                        <div style="font-weight:700; margin:4px 0; font-family:var(--font-serif);">${titles[role][1]}</div>
                        ${role === 'medico' && game.lastSavedPlayer ? `<div style="color:#d65d5d;font-size:0.8em;">Não pode salvar ${game.lastSavedPlayer} novamente.</div>` : ''}
                        ${game.isBlackout && role === 'medico' ? `<div style="color:#d65d5d;font-size:0.8em;">🔇 Apagão! Médico não acorda.</div>` : ''}
                    </div>
                    <div class="player-grid" id="nightSelectGrid" style="grid-template-columns:1fr 1fr;"></div>
                    <button class="btn btn-primary" id="btnNightAction" disabled>Confirmar</button>
                `;
                setupNightSelection(role, mainCard);
                updateAlivePlayersGrid(); updateGraveyard();
            }

            function setupNightSelection(role, mainCard) {
                const grid = document.getElementById('nightSelectGrid'); const btn = document.getElementById('btnNightAction');
                let selected = null;
                
                let availablePlayers = getAlivePlayers().filter(p => {
                    if (role === 'assassino' && p.role === 'assassino') return false;
                    if (role === 'mudo' && p.subclass === 'mudo') return false;
                    if (role === 'medico' && game.lastSavedPlayer === p.name) return false;
                    return true;
                });

                availablePlayers.forEach(p => {
                    const chip = document.createElement('div'); chip.className = 'player-chip';
                    const classIcon = CLASS_DEFS[p.role].icon;
                    const subIcon = p.subclass ? SUBCLASS_DEFS[p.subclass].icon : '';
                    chip.innerHTML = `<span class="chip-icon">${classIcon} ${subIcon}</span> ${p.name}`;
                    chip.onclick = () => { grid.querySelectorAll('.player-chip').forEach(c => c.classList.remove('selected')); chip.classList.add('selected'); selected = p.name; btn.disabled = false; };
                    grid.appendChild(chip);
                });

                btn.onclick = () => {
                    if (!selected) return;
                    if (role === 'assassino') { game.nightTargets.assassino = selected; addLog('🔪 Assassino escolheu o alvo.'); }
                    else if (role === 'medico') { game.nightTargets.medico = selected; addLog('💊 Médico escolheu quem salvar.'); }
                    else if (role === 'detetive_corrupto') { 
                        game.nightTargets.detetive = selected; 
                        const detetive = game.players.find(p => p.subclass === 'detetive_corrupto' && p.alive);
                        if(detetive) game.detetiveUses[detetive.name]--;
                        addLog(`🔍 Detetive Corrupto investigou ${selected}. (Usos restantes: ${game.detetiveUses[detetive.name]})`); 
                    }
                    else if (role === 'mudo') { game.mutedPlayer = selected; addLog(`🤫 Mudo silenciou ${selected}.`); }
                    game.nightStep++; renderGame();
                };
            }

            function resolveNight() {
                const mainCard = document.getElementById('gameMainCard');
                game.eliminatedTonight = []; game.savedTonight = null;
                let resultsHtml = '';

                const assassinoTarget = game.players.find(p => p.name === game.nightTargets.assassino && p.alive);
                const medicoTarget = game.nightTargets.medico;

                if (assassinoTarget) {
                    if (medicoTarget === assassinoTarget.name && !game.isBlackout) {
                        game.savedTonight = assassinoTarget.name; game.lastSavedPlayer = assassinoTarget.name;
                        resultsHtml += `<div class="result-banner result-safe">💊 <strong>${assassinoTarget.name}</strong> foi salvo pelo Médico!</div>`;
                        addLog(`💊 ${assassinoTarget.name} foi salvo.`);
                    } else {
                        killPlayer(assassinoTarget, 'Assassino', true, false);
                        game.eliminatedTonight.push(assassinoTarget);
                        resultsHtml += `<div class="result-banner result-death">🔪 <strong>${assassinoTarget.name}</strong> foi morto!</div>`;
                    }
                }

                if (medicoTarget && medicoTarget !== game.nightTargets.assassino && !game.isBlackout) {
                    game.lastSavedPlayer = medicoTarget; addLog(`💊 Médico protegeu ${medicoTarget}.`);
                }

                const detetivePadrao = getPlayerByRole('detetive');
                if (detetivePadrao && detetivePadrao.alive) {
                    const aliveTargets = getAlivePlayers().filter(p => p.name !== detetivePadrao.name);
                    if (aliveTargets.length > 0) {
                        const randomInvestigation = aliveTargets[Math.floor(Math.random() * aliveTargets.length)];
                        const isAssassino = randomInvestigation.role === 'assassino';
                        resultsHtml += `<div class="result-banner result-info">🔍 Detetive investigou <strong>${randomInvestigation.name}</strong>: ${isAssassino ? '⚠️ É O ASSASSINO!' : '✅ É Inocente.'}</div>`;
                        addLog(`🔍 Detetive investigou ${randomInvestigation.name}.`);
                    }
                }

                if (game.nightTargets.detetive) {
                    const detTarget = game.players.find(p => p.name === game.nightTargets.detetive);
                    if (detTarget) {
                        const isAssassino = detTarget.role === 'assassino';
                        resultsHtml += `<div class="result-banner result-info">🔍 Corrupto: <strong>${detTarget.name}</strong> ${isAssassino ? '⚠️ É O ASSASSINO!' : '✅ É Inocente.'}</div>`;
                    }
                }

                if (game.eliminatedTonight.length === 0 && !game.savedTonight) {
                    resultsHtml += `<div class="result-banner result-safe">🌙 Noite tranquila. Ninguém morreu.</div>`;
                    addLog('🌙 Noite tranquila.');
                }

                if (checkWinCondition()) return;
                if (game.pendingVingadorRevenge) return;

                game.isBlackout = false;
                game.phase = 'day'; game.dayStep = 0; game.nightStep = 0; game.nightTargets = {};
                game.eletricistaUsed = false;
                addLog('☀️ O dia amanheceu...');

                mainCard.innerHTML = resultsHtml + `<div style="text-align:center;margin-top:16px;"><button class="btn btn-primary" id="btnStartDay">☀️ Iniciar Dia</button></div>`;
                document.getElementById('btnStartDay').onclick = () => { game.dayStep = 1; renderGame(); };
                updateAlivePlayersGrid(); updateGraveyard(); updateMudoBanner(); updatePhaseIndicator();
            }

            function renderDayPhase(mainCard) {
                if (game.dayStep === 0) {
                    mainCard.innerHTML = `<div style="text-align:center;padding:20px;"><button class="btn btn-primary" id="btnStartDay">☀️ Iniciar Dia</button></div>`;
                    document.getElementById('btnStartDay').onclick = () => { game.dayStep = 1; renderGame(); };
                } else if (game.dayStep === 1) {
                    const eletricista = getEletricista();
                    let actionsHtml = `<button class="btn btn-danger" id="btnStartVoting" style="flex:1;">🗳️ Votar</button>`;
                    
                    if(eletricista && !game.eletricistaUsed) {
                        actionsHtml += `<button class="btn btn-secondary" id="btnEletricista" style="flex:1;margin-top:10px;">⚡ Apagar Luzes (Eletricista)</button>`;
                    }

                    mainCard.innerHTML = `
                        <div style="text-align:center; padding:20px 0; border-bottom:1px solid var(--border); margin-bottom:16px;">
                            <div style="font-size:2.5em;">💬</div>
                            <div style="font-weight:700; margin:4px 0; font-family:var(--font-serif);">Discussão do Dia</div>
                            <div style="color:var(--text-muted);font-size:0.85em;">Apontem o Assassino.</div>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:10px;">${actionsHtml}</div>
                    `;
                    document.getElementById('btnStartVoting').onclick = () => { game.dayStep = 2; renderGame(); };
                    
                    if(eletricista && !game.eletricistaUsed) {
                        document.getElementById('btnEletricista').onclick = () => {
                            game.eletricistaUsed = true;
                            game.isBlackout = true;
                            addLog(`⚡ ${eletricista.name} usou o poder! A próxima noite será um Apagão!`);
                            proceedToNextNight();
                        };
                    }
                } else if (game.dayStep === 2) {
                    mainCard.innerHTML = `
                        <div style="text-align:center; padding:20px 0; border-bottom:1px solid var(--border); margin-bottom:16px;">
                            <div style="font-size:2.5em;">🗳️</div>
                            <div style="font-weight:700; margin:4px 0; font-family:var(--font-serif);">Votação Final</div>
                            <div style="color:var(--text-muted);font-size:0.85em;">Quem é eliminado? (Mudo não pode ser votado)</div>
                        </div>
                        <div class="player-grid" id="voteSelectGrid" style="grid-template-columns:1fr 1fr;"></div>
                        <button class="btn btn-danger" id="btnConfirmVote" disabled>Eliminar</button>
                        <button class="btn btn-secondary" style="margin-top:8px;" id="btnSkipVote">Empate / Ninguém</button>
                    `;
                    setupVoteSelection();
                }
                updateAlivePlayersGrid(); updateGraveyard(); updateMudoBanner();
            }

            function setupVoteSelection() {
                const grid = document.getElementById('voteSelectGrid'); const btn = document.getElementById('btnConfirmVote');
                let selected = null; grid.innerHTML = '';
                
                const alive = getAlivePlayers().filter(p => p.name !== game.mutedPlayer);
                
                alive.forEach(p => {
                    const chip = document.createElement('div'); chip.className = 'player-chip';
                    const classIcon = CLASS_DEFS[p.role].icon;
                    const subIcon = p.subclass ? SUBCLASS_DEFS[p.subclass].icon : '';
                    chip.innerHTML = `<span class="chip-icon">${classIcon} ${subIcon}</span> ${p.name}`;
                    chip.onclick = () => { grid.querySelectorAll('.player-chip').forEach(c => c.classList.remove('selected')); chip.classList.add('selected'); selected = p.name; btn.disabled = false; };
                    grid.appendChild(chip);
                });
                
                btn.onclick = () => { if (selected) resolveVote(selected); };
                document.getElementById('btnSkipVote').onclick = () => { addLog('🗳️ Ninguém foi eliminado.'); proceedToNextNight(); };
            }

            function resolveVote(eliminatedName) {
                const target = game.players.find(p => p.name === eliminatedName && p.alive);
                if (!target) return;

                killPlayer(target, 'Votação', true, true);
                addLog(`🗳️ ${target.name} (${CLASS_DEFS[target.role].name}${target.subclass ? ' - ' + SUBCLASS_DEFS[target.subclass].name : ''}) foi eliminado.`);

                const mainCard = document.getElementById('gameMainCard');
                let resultHtml = `<div class="result-banner result-death">🗳️ <strong>${target.name}</strong> era <strong>${CLASS_DEFS[target.role].name}</strong>${target.subclass ? ' (' + SUBCLASS_DEFS[target.subclass].name + ')' : ''}.</div>`;

                if (target.subclass === 'bomba') {
                    resultHtml += `<div class="result-banner result-bomb-win">💣 A BOMBA EXPLODIU E VENCEU!</div>`;
                    game.winner = 'bomba'; game.phase = 'gameover';
                    mainCard.innerHTML = resultHtml;
                    setTimeout(() => endGame(), 1500); return;
                }

                mainCard.innerHTML = resultHtml;
                if (checkWinCondition()) return;
                if (game.pendingVingadorRevenge) return;
                setTimeout(() => proceedToNextNight(), 800);
            }

            function proceedToNextNight() {
                game.phase = 'night'; game.round++; game.nightStep = 0; game.nightTargets = {};
                game.eliminatedTonight = []; game.savedTonight = null; game.mutedPlayer = null; game.dayStep = 0;
                game.eletricistaUsed = false;
                addLog(`🌙 Noite ${game.round} começa...`);
                renderGame(); updatePhaseIndicator();
            }

            function endGame() {
                const mainCard = document.getElementById('gameMainCard'); if (mainCard) mainCard.innerHTML = '';
                const titles = {
                    bomba: ['💣', 'Bomba Venceu!', '#e09940', 'Explodiu e dominou o jogo!'],
                    cidadaos: ['🏆', 'Cidadãos Venceram!', '#80dba0', 'O Assassino foi derrotado!'],
                    assassino: ['🔪', 'Assassino Venceu!', '#d65d5d', 'A cidade está sob domínio do terror.'],
                    amantes: ['💘', 'Amantes Venceram!', '#d65d5d', 'O amor prevaleceu na cidade!']
                };
                const win = titles[game.winner] || titles['cidadaos'];
                document.getElementById('gameoverIcon').textContent = win[0];
                document.getElementById('gameoverTitle').textContent = win[1];
                document.getElementById('gameoverTitle').style.color = win[2];
                
                let details = game.players.map(p => {
                    const classIcon = CLASS_DEFS[p.role].icon;
                    const subIcon = p.subclass ? SUBCLASS_DEFS[p.subclass].icon : '';
                    return `${classIcon}${subIcon} ${p.name}: ${CLASS_DEFS[p.role].name}${p.subclass ? ' (' + SUBCLASS_DEFS[p.subclass].name + ')' : ''} ${p.alive ? '✅' : '💀'}`;
                }).join('<br>');
                document.getElementById('gameoverSubtitle').innerHTML = `${win[3]}<br><br><span style="font-size:0.7em;color:var(--text-muted);">${details}</span>`;
                
                addLog(`🏁 Fim de jogo: ${win[1]}`);
                updateGameLog(); showScreen('gameover');
                document.getElementById('btnRestart').onclick = () => { renderSetup(); showScreen('setup'); };
            }

            renderSetup();
        })();
    </script>
</body>
</html>
