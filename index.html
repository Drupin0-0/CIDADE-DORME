                        role:
                            game.selectedClasses[
                                index
                            ],

                        subclass:
                            game.selectedSubclasses[
                                index
                            ] || null,

                        alive: true,

                        coins: 0,

                        inventory: [],

                        missions: []

                    })
                );


            const amantes =
                game.players.filter(
                    player =>
                        player.subclass ===
                        'amante'
                );


            if (
                amantes.length >= 2
            ) {

                game.lovers = [

                    amantes[0].name,

                    amantes[1].name

                ];


                addLog(
                    `💘 ${amantes[0].name} e ${amantes[1].name} estão apaixonados!`
                );

            }


            game.players
                .filter(
                    p =>
                        p.subclass ===
                        'detetive_corrupto'
                )
                .forEach(
                    p => {

                        game.detetiveUses[
                            p.name
                        ] = 2;

                    }
                );


            game.currentRevealIndex =
                0;

            game.revealed =
                false;

            game.phase =
                'reveal';


            renderReveal();

            showScreen(
                'reveal'
            );

        };


        document.getElementById(
            'btnBackToSetup'
        ).onclick = () => {

            renderSetup();

        };

    }


    /* =========================================================
       REVELAÇÃO
    ========================================================= */

    function renderReveal() {

        const index =
            game.currentRevealIndex;


        const player =
            game.players[index];


        document.getElementById(
            'revealPlayerNum'
        ).textContent =
            index + 1;


        document.getElementById(
            'revealPlayerName'
        ).textContent =
            player.name;


        document.getElementById(
            'revealProgress'
        ).textContent =
            `${index + 1} / ${game.players.length}`;


        const card =
            document.getElementById(
                'revealCard'
            );


        card.classList.remove(
            'revealed'
        );


        card.querySelector(
            '.reveal-icon'
        ).textContent =
            '🃏';


        card.querySelector(
            '.reveal-icon'
        ).style.display =
            '';


        card.querySelector(
            '.reveal-text'
        ).textContent =
            'Toque para ver seu destino';


        card.querySelector(
            '.reveal-text'
        ).style.display =
            '';


        card.querySelector(
            '.reveal-role-name'
        ).style.display =
            'none';


        card.querySelector(
            '.reveal-sub-name'
        ).style.display =
            'none';


        card.querySelector(
            '.reveal-role-desc'
        ).style.display =
            'none';


        document.getElementById(
            'btnNextReveal'
        ).style.display =
            'none';


        document.getElementById(
            'btnStartGameAfterReveal'
        ).style.display =
            'none';


        game.revealed =
            false;


        card.onclick = () => {

            if (
                game.revealed
            ) {
                return;
            }


            game.revealed =
                true;


            const roleDef =
                CLASS_DEFS[
                    player.role
                ];


            const subDef =
                player.subclass
                    ? SUBCLASS_DEFS[
                        player.subclass
                    ]
                    : null;


            card.classList.add(
                'revealed'
            );


            card.querySelector(
                '.reveal-icon'
            ).textContent =
                roleDef.icon;


            card.querySelector(
                '.reveal-text'
            ).style.display =
                'none';


            const roleName =
                card.querySelector(
                    '.reveal-role-name'
                );


            roleName.textContent =
                `${roleDef.name} ${
                    subDef
                        ? '· ' + subDef.icon
                        : ''
                }`;


            roleName.style.display =
                '';


            roleName.style.color =
                roleDef.team === 'assassino'
                    ? '#d65d5d'
                    : '#80dba0';


            const subName =
                card.querySelector(
                    '.reveal-sub-name'
                );


            if (subDef) {

                subName.textContent =
                    `Subclasse: ${subDef.name}`;

                subName.style.display =
                    '';

            } else {

                subName.style.display =
                    'none';

            }


            const roleDesc =
                card.querySelector(
                    '.reveal-role-desc'
                );


            roleDesc.innerHTML =
                `${roleDef.desc}${
                    subDef
                        ? `<br><br>🛠️ <strong>Poder:</strong> ${subDef.desc}`
                        : ''
                }`;


            roleDesc.style.display =
                '';


            const nextButton =
                document.getElementById(
                    index <
                    game.players.length - 1
                        ? 'btnNextReveal'
                        : 'btnStartGameAfterReveal'
                );


            nextButton.style.display =
                '';

        };


        document.getElementById(
            'btnNextReveal'
        ).onclick = () => {

            game.currentRevealIndex++;

            renderReveal();

        };


        document.getElementById(
            'btnStartGameAfterReveal'
        ).onclick = () => {

            game.phase =
                'night';

            game.round =
                1;

            game.nightStep =
                0;

            game.nightTargets =
                {};

            game.mutedPlayer =
                null;

            game.isBlackout =
                false;

            addLog(
                '🌙 A primeira noite começa...'
            );


            renderGame();

            showScreen(
                'game'
            );

        };

    }


    /* =========================================================
       RENDER GAME
    ========================================================= */

    function renderGame() {

        updatePhaseIndicator();

        updateAlivePlayersGrid();

        updateGraveyard();

        updateMudoBanner();

        updateGameLog();


        const mainCard =
            document.getElementById(
                'gameMainCard'
            );


        if (
            game.phase === 'night'
        ) {

            renderNightPhase(
                mainCard
            );

        } else if (
            game.phase === 'day'
        ) {

            renderDayPhase(
                mainCard
            );

        }


        if (
            game.profilePlayer
        ) {

            renderPlayerProfile(
                game.profilePlayer
            );

        }

    }

       INDICADOR DE FASE
    ========================================================= */

        const element =
            document.getElementById(
                'phaseIndicator'
            );


        element.className =
            `game-phase-indicator ${
                game.phase === 'night'

    /* =========================================================
       JOGADORES VIVOS
    ========================================================= */

    function updateAlivePlayersGrid() {

                'alivePlayersGrid'
            );


        grid.innerHTML =
            '';


        getAlivePlayers().forEach(
            player => {

                    document.createElement(
                        'div'
                    );

                    player.subclass
                        ? SUBCLASS_DEFS[

                        .map(

                                `<span title="${
                                    ITEM_DEFS[itemId].name
                                }">
                                    ${
                                        ITEM_DEFS[itemId].icon
                                    }
                                </span>`
                        )

                chip.innerHTML = `

                    <span class="chip-icon">
                        ${classIcon}
                        ${subIcon}
                    </span>

                    <div class="player-chip-content">

                        <div class="player-chip-name">
                            ${player.name}
                        </div>

                        <div class="player-chip-coins">

                        </div>

                        <div class="inventory-mini">

                            }
                        </div>

    /* =========================================================
       CEMITÉRIO
    ========================================================= */

    function updateGraveyard() {

        const grave =

                'graveyard'
            );

            getDeadPlayers();

    /* =========================================================
       MUDO
    ========================================================= */

            );

    /* =========================================================
       NOITE
    ========================================================= */

    function renderNightPhase(
        mainCard
    ) {

        const assassino =
            getAssassino();


        const medico =
            getMedico();


        const mudo =
            getMudo();


        const steps = [];


        if (assassino) {
            steps.push(
                'assassino'
            );
        }


        if (
            medico &&
            !game.isBlackout
        ) {

            steps.push(
                'medico'
            );

        }


        const corrupto =
            game.players.find(
                player =>
                    player.subclass ===
                    'detetive_corrupto' &&
                    player.alive &&
                    game.detetiveUses[
                        player.name
                    ] > 0
            );


        if (corrupto) {

            steps.push(
                'detetive_corrupto'
            );

        }


        if (mudo) {

            steps.push(
                'mudo'
            );

        }


        steps.push(
            'resolve'
        );


        if (
            game.nightStep >=
            steps.length
        ) {

            resolveNight();

            return;

        }


        const role =
            steps[
                game.nightStep
            ];


        const titles = {

            assassino: [
                '🔪',
                'Assassino, escolha sua vítima.'
            ],

            medico: [
                '💊',
                'Médico, quem você protege?'
            ],

            detetive_corrupto: [
                '🔍',
                `Detetive Corrupto, quem investigar?`
            ],

            mudo: [
                '🤫',
                'Mudo, silencie alguém.'
            ]

        };


        mainCard.innerHTML = `

            <div style="
                text-align:center;
                padding:20px 0;
                margin-bottom:16px;
                border-bottom:1px solid var(--border);
            ">

                <div style="font-size:2.5em;">
                    ${titles[role][0]}
                </div>

                <div style="
                    font-weight:700;
                    margin:4px 0;
                    font-family:var(--font-serif);
                ">
                    ${titles[role][1]}
                </div>

            </div>


            <div
                class="player-grid"
                id="nightSelectGrid"
            ></div>


            <button
                class="btn btn-primary"
                id="btnNightAction"
                disabled
            >
                Confirmar
            </button>

        `;


        setupNightSelection(
            role
        );

    }


    function setupNightSelection(
        role
    ) {

        const grid =
            document.getElementById(
                'nightSelectGrid'
            );


        const btn =
            document.getElementById(
                'btnNightAction'
            );


        let selected = null;


        let available =
            getAlivePlayers().filter(
                player => {

                    if (
                        role === 'assassino' &&
                        player.role === 'assassino'
                    ) {
                        return false;
                    }


                    if (
                        role === 'mudo' &&
                        player.subclass === 'mudo'
                    ) {
                        return false;
                    }


                    if (
                        role === 'medico' &&
                        game.lastSavedPlayer ===
                        player.name
                    ) {
                        return false;
                    }


                    return true;

                }
            );


        available.forEach(
            player => {

                const chip =
                    document.createElement(
                        'div'
                    );


                chip.className =
                    'player-chip';


                chip.innerHTML = `

                    <span class="chip-icon">
                        ${CLASS_DEFS[player.role].icon}
                    </span>

                    <div class="player-chip-content">

                        <div class="player-chip-name">
                            ${player.name}
                        </div>

                    </div>

                `;


                chip.onclick = () => {

                    grid
                        .querySelectorAll(
                            '.player-chip'
                        )
                        .forEach(
                            c =>
                                c.classList.remove(
                                    'selected'
                                )
                        );


                    chip.classList.add(
                        'selected'
                    );


                    selected =
                        player.name;


                    btn.disabled =
                        false;

                };


                grid.appendChild(
                    chip
                );

            }
        );


        btn.onclick = () => {

            if (!selected) return;


            if (
                role === 'assassino'
            ) {

                game.nightTargets.assassino =
                    selected;

                addLog(
                    '🔪 Assassino escolheu o alvo.'
                );

            }


            else if (
                role === 'medico'
            ) {

                game.nightTargets.medico =
                    selected;

                addLog(
                    `💊 Médico protegeu ${selected}.`
                );

            }


            else if (
                role ===
                'detetive_corrupto'
            ) {

                game.nightTargets.detetive =
                    selected;


                const corrupto =
                    game.players.find(
                        p =>
                            p.subclass ===
                            'detetive_corrupto' &&
                            p.alive
                    );


                if (corrupto) {

                    game.detetiveUses[
                        corrupto.name
                    ]--;

                }


                addLog(
                    `🔍 Detetive Corrupto investigou ${selected}.`
                );

            }


            else if (
                role === 'mudo'
            ) {

                game.mutedPlayer =
                    selected;


                addLog(
                    `🤫 Mudo silenciou ${selected}.`
                );

            }


            game.nightStep++;

            renderGame();

        };

    }


    /* =========================================================
       RESOLVER NOITE
    ========================================================= */

    function resolveNight() {

        const mainCard =
            document.getElementById(
                'gameMainCard'
            );


        game.eliminatedTonight =
            [];


        game.savedTonight =
            null;


        let resultsHtml =
            '';


        const assassinTarget =
            getPlayerByName(
                game.nightTargets.assassino
            );


        const doctorTarget =
            game.nightTargets.medico;


        if (
            assassinTarget &&
            assassinTarget.alive
        ) {

            const protectedByDoctor =
                doctorTarget ===
                assassinTarget.name &&
                !game.isBlackout;


            const protectedByPill =
                game.doctorProtectionPlayers
                    .includes(
                        assassinTarget.name
                    );


            if (
                protectedByDoctor ||
                protectedByPill
            ) {

                game.savedTonight =
                    assassinTarget.name;


                game.lastSavedPlayer =
                    assassinTarget.name;


                game.doctorProtectionPlayers =
                    game.doctorProtectionPlayers
                        .filter(
                            name =>
                                name !==
                                assassinTarget.name
                        );


                resultsHtml += `

                    <div class="
                        result-banner
                        result-safe
                    ">
                        💊
                        <strong>
                            ${assassinTarget.name}
                        </strong>
                        foi salvo!
                    </div>

                `;


                addLog(
                    `💊 ${assassinTarget.name} foi salvo durante a noite.`
                );

            }

            else {

                const died =
                    killPlayer(
                        assassinTarget,
                        'Assassino',
                        true,
                        false
                    );


                if (died) {

                    game.eliminatedTonight
                        .push(
                            assassinTarget
                        );


                    resultsHtml += `

                        <div class="
                            result-banner
                            result-death
                        ">
                            🔪
                            <strong>
                                ${assassinTarget.name}
                            </strong>
                            foi morto!
                        </div>

                    `;

                }

            }

        }


        /*
         * Investigação normal
         */

        const detective =
            getPlayerByRole(
                'detetive'
            );


        if (
            detective &&
            detective.alive
        ) {

            const targets =
                getAlivePlayers()
                    .filter(
                        p =>
                            p.name !==
                            detective.name
                    );


            if (targets.length) {

                const target =
                    targets[
                        Math.floor(
                            Math.random() *
                            targets.length
                        )
                    ];


                const isAssassin =
                    target.role ===
                    'assassino';


                resultsHtml += `

                    <div class="
                        result-banner
                        result-info
                    ">
                        🔍 Detetive investigou
                        <strong>
                            ${target.name}
                        </strong>:
                        ${
                            isAssassin
                                ? '⚠️ É O ASSASSINO!'
                                : '✅ É Inocente.'
                        }
                    </div>

                `;

            }

        }


        /*
         * Investigação do Corrupto
         */

        if (
            game.nightTargets.detetive
        ) {

            const target =
                getPlayerByName(
                    game.nightTargets.detetive
                );


            if (target) {

                resultsHtml += `

                    <div class="
                        result-banner
                        result-info
                    ">
                        🔍 Detetive Corrupto:
                        <strong>
                            ${target.name}
                        </strong>
                        é
                        <strong>
                            ${CLASS_DEFS[target.role].name}
                        </strong>
                        ${
                            target.subclass
                                ? `(${SUBCLASS_DEFS[target.subclass].name})`
                                : ''
                        }.
                    </div>

                `;

            }

        }


        if (
            game.eliminatedTonight.length === 0 &&
            !game.savedTonight
        ) {

            resultsHtml += `

                <div class="
                    result-banner
                    result-safe
                ">
                    🌙 Noite tranquila.
                    Ninguém morreu.
                </div>

            `;

        }


        if (
            checkWinCondition()
        ) {

            return;

        }


        if (
            game.pendingVingadorRevenge
        ) {

            return;

        }


        game.isBlackout =
            false;


        game.phase =
            'day';


        game.dayStep =
            0;


        game.nightStep =
            0;


        game.nightTargets =
            {};


        game.eletricistaUsed =
            false;


        addLog(
            '☀️ O dia amanheceu...'
        );


        mainCard.innerHTML =
            resultsHtml +
            `

                <div style="
                    text-align:center;
                    margin-top:16px;
                ">

                    <button
                        class="btn btn-primary"
                        id="btnStartDay"
                    >
                        ☀️ Iniciar Dia
                    </button>

                </div>

            `;


        document.getElementById(
            'btnStartDay'
        ).onclick = () => {

            game.dayStep =
                1;

            renderGame();

        };


        updateAlivePlayersGrid();
        updateGraveyard();
        updateMudoBanner();
        updatePhaseIndicator();

    }

                    );

        ) {

                <div style="

                    border-bottom:1px solid var(--border);
                    margin-bottom:16px;
                ">

                    <div style="font-size:2.5em;">

                    <div style="
                        font-weight:700;
                        margin:4px 0;
                        font-family:var(--font-serif);
                    ">
                        Votação Final
                    </div>

                    <div style="
                        color:var(--text-muted);
                        font-size:0.85em;
                    ">
                        Escolha quem será eliminado.
                    </div>

                </div>

                <div
                    class="player-grid"
                    id="voteSelectGrid"
                ></div>

                <button
                    class="btn btn-danger"
                    id="btnConfirmVote"
                    disabled
                >
                    Eliminar
                </button>

                <button
                    class="btn btn-secondary"
                    style="margin-top:8px;"
                    id="btnSkipVote"
                >
                    Empate / Ninguém
                </button>

            `;


            setupVoteSelection();

        }


        updateAlivePlayersGrid();
        updateGraveyard();
        updateMudoBanner();

    }


    /* =========================================================
       VOTAÇÃO
    ========================================================= */

    function setupVoteSelection() {

        const grid =
            document.getElementById(
                'voteSelectGrid'
            );


        const button =
            document.getElementById(
                'btnConfirmVote'
            );


        let selected =
            null;


        const alive =
            getAlivePlayers()
                .filter(
                    player => {

                        if (
                            player.name ===
                            game.mutedPlayer
                        ) {
                            return false;
                        }


                        if (
                            player.name ===
                            game.handcuffedPlayer
                        ) {
                            return false;
                        }


                        return true;

                    }
                );


        alive.forEach(
            player => {

                const chip =
                    document.createElement(
                        'div'
                    );


                chip.className =
                    'player-chip';


                chip.innerHTML = `

                    <span class="chip-icon">
                        ${CLASS_DEFS[player.role].icon}
                    </span>

                    <div class="player-chip-content">

                        <div class="player-chip-name">
                            ${player.name}
                        </div>

                        <div class="player-chip-coins">
                            🪙 ${player.coins || 0}
                        </div>

                    </div>

                `;


                chip.onclick = () => {

                    grid
                        .querySelectorAll(
                            '.player-chip'
                        )
                        .forEach(
                            c =>
                                c.classList.remove(
                                    'selected'
                                )
                        );


                    chip.classList.add(
                        'selected'
                    );


                    selected =
                        player.name;


                    button.disabled =
                        false;

                };


                grid.appendChild(
                    chip
                );

            }
        );


        button.onclick = () => {

            if (
                selected
            ) {

                resolveVote(
                    selected
                );

            }

        };


        document.getElementById(
            'btnSkipVote'
        ).onclick = () => {

            addLog(
                '🗳️ Ninguém foi eliminado.'
            );


            proceedToNextNight();

        };

    }


    /* =========================================================
       RESOLVER VOTO
    ========================================================= */

    function resolveVote(
        eliminatedName
    ) {

        const target =
            getPlayerByName(
                eliminatedName
            );


        if (
            !target ||
            !target.alive
        ) {
            return;
        }


        /*
         * Colete protege contra a votação
         */

        if (
            game.shieldPlayers.includes(
                target.name
            )
        ) {

            game.shieldPlayers =
                game.shieldPlayers.filter(
                    name =>
                        name !==
                        target.name
                );


            addLog(
                `🛡️ O Colete salvou ${target.name} da votação!`
            );


            document.getElementById(
                'gameMainCard'
            ).innerHTML = `

                <div class="
                    result-banner
                    result-safe
                ">
                    🛡️
                    <strong>
                        ${target.name}
                    </strong>
                    foi protegido pelo Colete!
                </div>

                <button
                    class="btn btn-primary"
                    id="continueAfterShield"
                >
                    Continuar
                </button>

            `;


            document.getElementById(
                'continueAfterShield'
            ).onclick = () =>
                proceedToNextNight();


            return;

        }


        killPlayer(
            target,
            'Votação',
            true,
            true
        );


        addLog(
            `🗳️ ${target.name} foi eliminado pela votação.`
        );


        const mainCard =
            document.getElementById(
                'gameMainCard'
            );


        let resultHtml = `

            <div class="
                result-banner
                result-death
            ">
                🗳️
                <strong>
                    ${target.name}
                </strong>
                foi eliminado.
            </div>

        `;


        if (
            target.subclass ===
            'bomba'
        ) {

            resultHtml += `

                <div class="
                    result-banner
                    result-bomb-win
                ">
                    💣 A BOMBA FOI ELIMINADA
                    E VENCEU!
                </div>

            `;


            game.winner =
                'bomba';


            game.phase =
                'gameover';


            mainCard.innerHTML =
                resultHtml;


            setTimeout(
                () => endGame(),
                1000
            );


            return;

        }


        mainCard.innerHTML =
            resultHtml;


        if (
            checkWinCondition()
        ) {
            return;
        }


        if (
            game.pendingVingadorRevenge
        ) {
            return;
        }


        setTimeout(
            () =>
                proceedToNextNight(),
            700
        );

    }


    /* =========================================================
       PRÓXIMA NOITE
    ========================================================= */

    function proceedToNextNight() {

        /*
         * Recompensa de sobrevivência
         */

        rewardSurvivors();


        /*
         * Algemas duram uma rodada
         */

        game.handcuffedPlayer =
            null;


        game.phase =
            'night';


        game.round++;


        game.nightStep =
            0;


        game.nightTargets =
            {};


        game.eliminatedTonight =
            [];


        game.savedTonight =
            null;


        game.mutedPlayer =
            null;


        game.dayStep =
            0;


        game.eletricistaUsed =
            false;


        addLog(
            `🌙 Noite ${game.round} começa...`
        );


        renderGame();

    }


    /* =========================================================
       FIM DE JOGO
    ========================================================= */

    function endGame() {

        const mainCard =
            document.getElementById(
                'gameMainCard'
            );


        if (mainCard) {
            mainCard.innerHTML =
                '';
        }


        const titles = {

            bomba: [
                '💣',
                'Bomba Venceu!',
                '#e09940',
                'A Bomba conseguiu seu objetivo.'
            ],

            cidadaos: [
                '🏆',
                'Cidadãos Venceram!',
                '#80dba0',
                'O Assassino foi derrotado!'
            ],

            assassino: [
                '🔪',
                'Assassino Venceu!',
                '#d65d5d',
                'A cidade está sob domínio do terror.'
            ]

        };


        const win =
            titles[
                game.winner
            ] ||
            titles.cidadaos;


        document.getElementById(
            'gameoverIcon'
        ).textContent =
            win[0];


        document.getElementById(
            'gameoverTitle'
        ).textContent =
            win[1];


        document.getElementById(
            'gameoverTitle'
        ).style.color =
            win[2];


        const details =
            game.players
                .map(
                    player => {

                        const classIcon =
                            CLASS_DEFS[
                                player.role
                            ].icon;


                        const subIcon =
                            player.subclass
                                ? SUBCLASS_DEFS[
                                    player.subclass
                                ].icon
                                : '';


                        return `
                            ${classIcon}${subIcon}
                            ${player.name}:
                            ${CLASS_DEFS[player.role].name}
                            ${
                                player.subclass
                                    ? `(${SUBCLASS_DEFS[player.subclass].name})`
                                    : ''
                            }
                            ${
                                player.alive
                                    ? '✅'
                                    : '💀'
                            }
                            🪙${player.coins || 0}
                        `;

                    }
                )
                .join('<br>');


        document.getElementById(
            'gameoverSubtitle'
        ).innerHTML =
            `
                ${win[3]}

                <br><br>

                <span style="
                    font-size:0.7em;
                    color:var(--text-muted);
                ">
                    ${details}
                </span>
            `;


        addLog(
            `🏁 Fim de jogo: ${win[1]}`
        );


        updateGameLog();


        showScreen(
            'gameover'
        );


        document.getElementById(
            'btnRestart'
        ).onclick = () => {

            renderSetup();

        };

    }


    /* =========================================================
       INICIALIZAÇÃO
    ========================================================= */

    renderSetup();

})();

</script>

</body>
</html>
