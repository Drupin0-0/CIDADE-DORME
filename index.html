<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade Dorme - O Jogo da Noite</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #18161a;
            --bg-card: #242126;
            --bg-input: #2d2a30;
            --text: #efe7dd;
            --text-muted: #8a8075;
            --accent: #c4a06c;
            --accent-dim: #c4a06c20;
            --border: #423b34;
            --radius: 4px;
            --font-serif: 'Cinzel', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background-image:
                radial-gradient(circle at 20% 20%, rgba(80, 60, 40, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(40, 30, 20, 0.4) 0%, transparent 50%);
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .header-brand {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            border-bottom: 2px double var(--border);
            padding-bottom: 20px;
        }

        .header-brand::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: var(--accent);
        }

        .moon-icon {
            font-size: 70px;
            display: block;
            color: var(--text);
            filter: drop-shadow(0 0 20px rgba(196, 160, 108, 0.2));
            margin-bottom: -10px;
        }

        .logo-title {
            font-family: var(--font-serif);
            font-size: 3em;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--text);
            text-transform: uppercase;
            margin: 0;
            line-height: 1;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
        }

        .logo-title span {
            font-weight: 900;
            font-style: italic;
            color: var(--accent);
        }

        .logo-subtitle {
            font-size: 0.6em;
            color: var(--text-muted);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 8px;
            font-weight: 300;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            display: inline-block;
        }

        .screen {
            display: none;
            animation: fadeSlide 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
        }

        h2 {
            font-family: var(--font-serif);
            font-size: 1.1em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .player-count-input-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .player-count-input {
            width: 80px;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.4em;
            font-weight: 700;
            text-align: center;
            outline: none;
            font-family: var(--font-serif);
            border-radius: var(--radius);
        }

        .player-count-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(196, 160, 108, 0.2);
        }

        .role-toggles {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            cursor: pointer;
            transition: 0.3s ease;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
        }

        .role-toggle:last-child {
            border-bottom: none;
        }

        .role-toggle:hover {
            background: rgba(196, 160, 108, 0.05);
        }

        .role-toggle.active {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .role-toggle-icon {
            font-size: 1.5em;
            width: 35px;
            text-align: center;
        }

        .role-toggle-info {
            flex: 1;
        }

        .role-toggle-name {
            font-size: 0.95em;
            font-weight: 600;
            color: var(--text);
        }

        .role-toggle-desc {
            font-size: 0.75em;
            color: var(--text-muted);
        }

        .role-toggle-badge {
            font-size: 0.6em;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .badge-on {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            border-radius: var(--radius);
            font-size: 0.85em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.3s ease;
            width: 100%;
            font-family: var(--font-serif);
            background: transparent;
            color: var(--text);
        }

        .btn-primary {
            background: var(--accent);
            color: #18161a;
            border: 1px solid var(--accent);
        }

        .btn-primary:hover {
            background: #d4b07c;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(196, 160, 108, 0.3);
        }

        .btn-danger {
            background: transparent;
            color: #d65d5d;
            border: 1px solid rgba(214, 93, 93, 0.3);
        }

        .btn-danger:hover {
            background: rgba(214, 93, 93, 0.1);
            border-color: #d65d5d;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            color: var(--text);
            border-color: #666;
        }

        .btn-success {
            color: #80dba0;
            border-color: rgba(84,204,125,0.3);
        }

        .btn-success:hover {
            background: rgba(84,204,125,0.1);
            border-color: #80dba0;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: default;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .name-input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 0 14px;
            border-radius: var(--radius);
            transition: 0.3s ease;
            margin-bottom: 10px;
        }

        .name-input-group:focus-within {
            border-color: var(--accent);
        }

        .name-input-num {
            color: var(--text-muted);
            font-size: 0.8em;
            font-weight: 700;
            font-family: var(--font-serif);
        }

        .name-input-group input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.95em;
            padding: 12px 0;
            outline: none;
            font-family: var(--font-sans);
        }

        .reveal-card {
            text-align: center;
            padding: 40px 20px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.3s ease;
            background: rgba(0,0,0,0.3);
            border-radius: var(--radius);
            position: relative;
        }

        .reveal-card::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid var(--border);
            pointer-events: none;
        }

        .reveal-card.revealed {
            border-color: var(--accent);
        }

        .reveal-card.revealed::before {
            border-color: var(--accent);
        }

        .reveal-icon {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .reveal-text {
            color: var(--text-muted);
            font-size: 0.9em;
            letter-spacing: 2px;
        }

        .reveal-role-name {
            font-family: var(--font-serif);
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .reveal-sub-name {
            font-size: 1em;
            color: var(--text-muted);
            margin-top: 4px;
            font-style: italic;
        }

        .reveal-role-desc {
            color: var(--text-muted);
            font-size: 0.85em;
            margin-top: 6px;
            line-height: 1.4;
        }

        .game-phase-indicator {
            text-align: center;
            padding: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.75em;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-family: var(--font-serif);
        }

        .phase-night {
            color: #9ea0c0;
            border-color: #3a3a55;
        }

        .phase-day {
            color: var(--accent);
            border-color: var(--accent-dim);
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .player-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 0.85em;
            border-radius: var(--radius);
            transition: 0.3s ease;
        }

        .player-chip:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--border);
        }

        .player-chip.selected {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .player-chip.dead {
            opacity: 0.45;
        }

        .chip-icon {
            width: 25px;
            text-align: center;
            font-size: 1.1em;
        }

        .player-chip-content {
            flex: 1;
            min-width: 0;
        }

        .player-chip-name {
            font-weight: 600;
        }

        .player-chip-coins {
            color: var(--accent);
            font-size: 0.72em;
            margin-top: 2px;
        }

        .inventory-mini {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 4px;
        }

        .inventory-mini span {
            font-size: 0.85em;
            background: rgba(196,160,108,0.08);
            border: 1px solid rgba(196,160,108,0.15);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .graveyard {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .graveyard-chip {
            font-size: 0.65em;
            padding: 6px 8px;
            background: rgba(0,0,0,0.6);
            color: #777;
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            cursor: pointer;
        }

        .graveyard-chip:hover {
            border-color: var(--accent);
            color: var(--text-muted);
        }

        .result-banner {
            padding: 14px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            text-align: center;
            font-size: 0.9em;
            background: rgba(0,0,0,0.3);
        }

        .result-death {
            border-color: rgba(214, 93, 93, 0.4);
            color: #d65d5d;
        }

        .result-safe {
            border-color: rgba(84, 204, 125, 0.4);
            color: #80dba0;
        }

        .result-info {
            border-color: rgba(196, 160, 108, 0.4);
            color: var(--accent);
        }

        .result-bomb-win {
            border-color: #c07830;
            color: #e09940;
            font-weight: 700;
        }

        .game-log {
            max-height: 150px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0,0,0,0.4);
            font-size: 0.7em;
            color: var(--text-muted);
            line-height: 1.6;
            border: 1px solid var(--border);
            font-family: var(--font-sans);
        }

        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .profile-panel {
            border-left-color: var(--accent);
            animation: fadeSlide 0.25s ease;
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 14px;
            margin-bottom: 15px;
        }

        .profile-name {
            font-family: var(--font-serif);
            font-size: 1.3em;
            color: var(--accent);
        }

        .profile-status {
            font-size: 0.7em;
            color: var(--text-muted);
        }

        .profile-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .profile-stat-value {
            color: var(--accent);
            font-weight: 700;
        }

        .management-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .management-grid .btn {
            padding: 12px 6px;
            font-size: 0.7em;
        }

        .section-title {
            color: var(--text-muted);
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin: 18px 0 10px;
        }

        .item-card {
            padding: 12px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            margin-bottom: 8px;
        }

        .item-card.purchased {
            opacity: 0.4;
        }

        .item-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-icon {
            font-size: 1.5em;
        }

        .item-name {
            flex: 1;
            font-weight: 600;
        }

        .item-price {
            color: var(--accent);
            font-weight: 700;
            font-size: 0.8em;
        }

        .item-description {
            color: var(--text-muted);
            font-size: 0.72em;
            line-height: 1.4;
            margin: 7px 0;
        }

        .item-card .btn {
            padding: 9px;
            font-size: 0.65em;
        }

        .mission-card {
            padding: 10px;
            border: 1px solid var(--border);
            margin-bottom: 7px;
            background: rgba(0,0,0,0.15);
        }

        .mission-card.completed {
            opacity: 0.45;
            border-color: rgba(84,204,125,0.3);
        }

        .mission-title {
            font-size: 0.78em;
            font-weight: 600;
        }

        .mission-description {
            color: var(--text-muted);
            font-size: 0.7em;
            margin-top: 4px;
            line-height: 1.4;
        }

        .item-use-note {
            color: var(--text-muted);
            font-size: 0.7em;
            text-align: center;
            padding: 8px;
            border: 1px dashed var(--border);
            margin-bottom: 10px;
        }

        .leader-label {
            color: var(--accent);
            font-size: 0.65em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .gameover-card {
            text-align: center;
            padding: 40px 20px;
        }

        .gameover-icon {
            font-size: 80px;
            display: block;
            margin-bottom: 10px;
        }

        .gameover-title {
            font-family: var(--font-serif);
            font-size: 2.5em;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .gameover-subtitle {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        @media (max-width: 400px) {
            .logo-title {
                font-size: 2.2em;
                letter-spacing: 3px;
            }

            .player-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app-container">

    <div class="header-brand">
        <span class="moon-icon">🌙</span>
        <div class="logo-title"><span>Cidade</span> Dorme</div>
        <div class="logo-subtitle">O Jogo da Noite</div>
    </div>

    <!-- =========================
         CONFIGURAÇÃO
    ========================== -->

    <div class="screen active" id="screen-setup">

        <div class="card">
            <h2>+ Configuração</h2>

            <div class="player-count-input-container">
                <label style="color:var(--text-muted);font-size:0.8em;letter-spacing:2px;text-transform:uppercase;">
                    Participantes (5-12)
                </label>

                <input
                    type="number"
                    class="player-count-input"
                    id="playerCountInput"
                    min="5"
                    max="12"
                    value="6"
                >
            </div>
        </div>

        <div class="card">

            <h2>Subclasses (Únicas)</h2>

            <div class="role-toggles" id="subclassToggles"></div>

            <div style="display:flex;gap:10px;margin-top:12px;">
                <button class="btn btn-secondary" id="btnRandomizeSubs">
                    🎲 Sortear
                </button>
            </div>

            <div
                style="
                    text-align:center;
                    color:var(--text-muted);
                    font-size:0.75em;
                    margin-top:12px;
                    border-top:1px solid var(--border);
                    padding-top:12px;
                "
                id="roleSummary"
            ></div>

        </div>

        <button class="btn btn-primary" id="btnStartSetup">
            Distribuir Funções
        </button>

    </div>


    <!-- =========================
         NOMES
    ========================== -->

    <div class="screen" id="screen-names">

        <div class="card">

            <h2>Jogadores</h2>

            <p style="
                color:var(--text-muted);
                font-size:0.8em;
                margin-bottom:16px;
                text-align:center;
                letter-spacing:1px;
            ">
                Nomeie cada participante.
            </p>

            <div class="name-inputs" id="nameInputs"></div>

            <button class="btn btn-primary" id="btnDistributeRoles">
                Iniciar Jogo
            </button>

            <button
                class="btn btn-secondary"
                style="margin-top:8px;"
                id="btnBackToSetup"
            >
                ← Voltar
            </button>

        </div>

    </div>


    <!-- =========================
         REVELAÇÃO
    ========================== -->

    <div class="screen" id="screen-reveal">

        <div class="card">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:20px;
                color:var(--text-muted);
                font-size:0.7em;
                text-transform:uppercase;
                letter-spacing:2px;
                border-bottom:1px solid var(--border);
                padding-bottom:10px;
            ">
                <span>
                    Jogador
                    <span id="revealPlayerNum" style="color:var(--accent);">1</span>
                </span>

                <span id="revealProgress">0 / 0</span>
            </div>

            <div
                style="
                    text-align:center;
                    font-size:1.3em;
                    font-weight:600;
                    margin-bottom:20px;
                    border:1px solid var(--border);
                    padding:8px;
                    background:rgba(0,0,0,0.2);
                "
                id="revealPlayerName"
            >
                —
            </div>

            <div class="reveal-card" id="revealCard">

                <span class="reveal-icon">🃏</span>

                <span class="reveal-text">
                    Toque para ver seu destino
                </span>

                <div
                    class="reveal-role-name"
                    style="display:none;"
                    id="revealRoleName"
                ></div>

                <div
                    class="reveal-sub-name"
                    style="display:none;"
                    id="revealSubName"
                ></div>

                <div
                    class="reveal-role-desc"
                    style="display:none;"
                    id="revealRoleDesc"
                ></div>

            </div>

            <button
                class="btn btn-primary"
                id="btnNextReveal"
                style="margin-top:16px;display:none;"
            >
                Próximo
            </button>

            <button
                class="btn btn-primary"
                id="btnStartGameAfterReveal"
                style="margin-top:16px;display:none;"
            >
                A Noite Começa
            </button>

        </div>

    </div>


    <!-- =========================
         JOGO
    ========================== -->

    <div class="screen" id="screen-game">

        <div
            class="game-phase-indicator phase-night"
            id="phaseIndicator"
        >
            🌙 Noite — Rodada 0
        </div>

        <div class="card" id="gameMainCard"></div>

        <!-- PERFIL DO JOGADOR -->
        <div
            class="card profile-panel"
            id="playerProfilePanel"
            style="display:none;"
        ></div>


        <!-- JOGADORES -->
        <div class="card">

            <div style="
                display:flex;
                justify-content:space-between;
                border-bottom:1px solid var(--border);
                padding-bottom:8px;
                margin-bottom:12px;
            ">
                <span style="
                    font-size:0.7em;
                    text-transform:uppercase;
                    letter-spacing:2px;
                    color:var(--text-muted);
                ">
                    Vivos
                </span>

                <span style="
                    font-size:0.7em;

<script>

(function() {

    /* =========================================================

    /* =========================================================

    const ITEM_DEFS = {

        },

            icon: '💊',
            price: 40,
            desc: 'Permite usar a proteção do Médico em si mesmo ou em outro jogador.'
        },

        roleta: {
            name: 'Roleta Russa All Win',
            icon: '🎰',
            price: 5,
            desc: 'Aposta todo o dinheiro com outro jogador. Quem perder morre e seu dinheiro vai para o vencedor.'
        },

        algema: {
            name: 'Algema',
            icon: '⛓️',
            price: 30,
            desc: 'Impede um jogador de votar e de ser votado durante a rodada.'
        }

    };


    /* =========================================================
       MISSÕES
    ========================================================= */

    const MISSIONS = [

        {
            id: 'silencio',
            title: '🤫 Silêncio Absoluto',
            description: 'Seja silenciado por 3 noites seguidas pelo Mudo.'
        },

        {
            id: 'isca',

            description: 'Faça um jogador aleatório cair em um ragebait.'
        },

        {
            id: 'identidade',
            title: '🎭 Falsa Identidade',
            description: 'Faça um jogador acusar você de ser um papel que você não é.'
        },

        {
            id: 'salvamento',
            title: '💊 Salvamento',
            description: 'Faça o Médico salvar o jogador que o Assassino atacar.'
        },

        {
            id: 'mentira',
            title: '🪤 Mentira Perfeita',
            description: 'Faça o jogador escolhido acreditar em uma informação falsa sua.'
        },

        {
            id: 'voto',
            title: '🩸 Voto Fatal',
            description: 'Como Assassino, convença os jogadores a votarem em um inocente.'
        },

        {
            id: 'inimigo',
            title: '💢 Inimigo Público',
            description: 'Seja odiado por 2 jogadores.'
        }

    ];


    /* =========================================================
       TELAS
    ========================================================= */

    const screens = {

        setup: document.getElementById('screen-setup'),
        names: document.getElementById('screen-names'),
        reveal: document.getElementById('screen-reveal'),
        game: document.getElementById('screen-game'),
        gameover: document.getElementById('screen-gameover')

    };


    function showScreen(name) {

        Object.values(screens).forEach(screen => {
            screen.classList.remove('active');
        });

        screens[name].classList.add('active');

    }


    /* =========================================================
       ESTADO DA PARTIDA
    ========================================================= */

    let game = {

        playerCount: 6,

        selectedSubclasses: [],

        selectedClasses: [],

        players: [],

        currentRevealIndex: 0,

        revealed: false,

        phase: 'setup',

        nightStep: 0,

        dayStep: 0,

        nightTargets: {},

        lastSavedPlayer: null,

        mutedPlayer: null,

        eliminatedTonight: [],

        savedTonight: null,

        gameLog: [],

        round: 0,

        winner: null,

        pendingVingadorRevenge: false,

        isBlackout: false,

        detetiveUses: {},

        eletricistaUsed: false,

        balaMagicaUsed: false,

        lovers: [],

        amanteDeathTriggered: false,

        profilePlayer: null,

        store: {},

        shieldPlayers: [],

        doctorProtectionPlayers: [],

        handcuffedPlayer: null

    };


    /* =========================================================
       UTILIDADES
    ========================================================= */

    function shuffleArray(arr) {

        const a = [...arr];

        for (
            let i = a.length - 1;
            i > 0;
            i--
        ) {

            const j = Math.floor(Math.random() * (i + 1));

            [
                a[i],
                a[j]
            ] = [
                a[j],
                a[i]
            ];

        }

        return a;

    }


    function getAlivePlayers() {

        return game.players.filter(player => player.alive);

    }


    function getDeadPlayers() {

        return game.players.filter(player => !player.alive);

    }


    function getPlayerByName(name) {

        return game.players.find(player => player.name === name);

    }


    function getPlayerByRole(role) {

        return game.players.find(
            player =>
                player.role === role &&
                player.alive
        );

    }


    function getAssassino() {
        return getPlayerByRole('assassino');
    }


    function getMedico() {
        return getPlayerByRole('medico');
    }


    function getMudo() {

        return game.players.find(
            player =>
                player.subclass === 'mudo' &&
                player.alive
        );

    }


    function getEletricista() {

        return game.players.find(
            player =>
                player.subclass === 'eletricista' &&
                player.alive
        );

    }


    function addLog(message) {

        game.gameLog.push(
            `[Rodada ${game.round}] ${message}`
        );

        if (game.gameLog.length > 60) {
            game.gameLog.shift();
        }

        updateGameLog();

    }


    /* =========================================================
       MOEDAS
    ========================================================= */

    function changeCoins(player, amount) {

        if (!player) return;

        player.coins = Math.max(
            0,
            (player.coins || 0) + amount
        );

        addLog(
            `🪙 ${player.name} recebeu alteração de ${amount >= 0 ? '+' : ''}${amount} moedas.`
        );

        renderPlayerProfile(player.name);

        updateAlivePlayersGrid();
        updateGraveyard();

    }


    function rewardSurvivors() {

        const alive = getAlivePlayers();

        alive.forEach(player => {

            player.coins = (player.coins || 0) + 5;

            addLog(
                `🪙 ${player.name} sobreviveu à rodada e recebeu 5 moedas.`
            );

        });

    }


    /* =========================================================
       LOJA
    ========================================================= */

    function resetStore() {

        game.store = {};

        Object.keys(ITEM_DEFS).forEach(itemId => {

            game.store[itemId] = {

                purchased: false,

                purchasedBy: null

            };

        });

    }


    function purchaseItem(playerName, itemId) {

        if (game.phase !== 'day') {

            alert('A loja só está disponível durante o Dia.');

            return;

        }

        const player = getPlayerByName(playerName);

        const item = ITEM_DEFS[itemId];

        if (!player || !item) return;


        if (game.store[itemId].purchased) {

            alert(
                `O item ${item.name} já foi comprado por outro jogador.`
            );

            return;

        }


        if (player.coins < item.price) {

            alert(
                `${player.name} não possui moedas suficientes.`
            );

            return;

        }


        player.coins -= item.price;

        player.inventory.push(itemId);

        game.store[itemId].purchased = true;

        game.store[itemId].purchasedBy = player.name;


        addLog(
            `🏪 ${player.name} comprou ${item.icon} ${item.name} por ${item.price} moedas.`
        );


        renderPlayerProfile(player.name);

        updateAlivePlayersGrid();
        updateGraveyard();

    }


    function hasItem(player, itemId) {

        return player &&
               player.inventory &&
               player.inventory.includes(itemId);

    }


    function consumeItem(player, itemId) {

        if (!hasItem(player, itemId)) {
            return false;
        }

        player.inventory =
            player.inventory.filter(
                item => item !== itemId
            );

        return true;

    }


    /* =========================================================
       MATAR / REVIVER
    ========================================================= */

    function manualKill(player) {

        if (!player || !player.alive) return;

        player.alive = false;

        addLog(
            `☠️ O líder matou ${player.name} manualmente.`
        );

        checkWinCondition();

        renderPlayerProfile(player.name);
        updateAlivePlayersGrid();
        updateGraveyard();

    }


    function manualRevive(player) {

        if (!player || player.alive) return;

        player.alive = true;

        addLog(
            `❤️ O líder reviveu ${player.name}.`
        );

        game.winner = null;

        renderPlayerProfile(player.name);
        updateAlivePlayersGrid();
        updateGraveyard();

    }


    /* =========================================================
       MORTE NORMAL
    ========================================================= */

    function killPlayer(
        player,
        cause,
        triggerVingador = true,
        isVote = false,
        ignoreShield = false
    ) {

        if (!player || !player.alive) return false;


        /*
         * Colete
         */

        if (
            !ignoreShield &&
            game.shieldPlayers.includes(player.name)
        ) {

            game.shieldPlayers =
                game.shieldPlayers.filter(
                    name => name !== player.name
                );

            addLog(
                `🛡️ O Colete protegeu ${player.name}!`
            );

            return false;

        }


        player.alive = false;

        addLog(
            `${player.name} (${CLASS_DEFS[player.role].name}${
                player.subclass
                    ? ' - ' + SUBCLASS_DEFS[player.subclass].name
                    : ''
            }) foi eliminado(a) — ${cause}`
        );


        /*
         * Amantes
         */

        if (
            game.lovers.includes(player.name) &&
            !game.amanteDeathTriggered
        ) {

            const otherLover =
                game.players.find(
                    p =>
                        game.lovers.includes(p.name) &&
                        p.name !== player.name &&
                        p.alive
                );

            if (otherLover) {

                game.amanteDeathTriggered = true;

                addLog(
                    `💘 ${player.name} morreu. ${otherLover.name} também morreu por causa dos Amantes.`
                );

                killPlayer(
                    otherLover,
                    'Amante',
                    false,
                    false,
                    true
                );

                game.amanteDeathTriggered = false;

            }

        }


        /*
         * Vingador
         */

        if (
            triggerVingador &&
            player.subclass === 'vingador' &&
            !isVote &&
            player.role !== 'assassino'
        ) {

            triggerVingadorRevenge(player);

        }


        return true;

    }


    /* =========================================================
       VINGADOR
    ========================================================= */

    function triggerVingadorRevenge(vingadorPlayer) {

        const aliveOthers =
            getAlivePlayers().filter(
                p => p.name !== vingadorPlayer.name
            );

        if (!aliveOthers.length) return;


        game.pendingVingadorRevenge = true;

        const mainCard =
            document.getElementById('gameMainCard');


        mainCard.innerHTML = `

            <div style="
                text-align:center;
                padding:20px;
                border:1px solid var(--border);
                margin-bottom:16px;
                background:rgba(0,0,0,0.3);
            ">

                <div style="font-size:2.5em;">⚔️</div>

                <div style="
                    font-weight:700;
                    margin:4px 0;
                    font-family:var(--font-serif);
                ">
                    Vingança!
                </div>

                <div style="
                    color:var(--text-muted);
                    font-size:0.85em;
                ">
                    ${vingadorPlayer.name} foi morto e pode levar alguém junto.
                </div>

            </div>

            <div
                class="player-grid"
                id="vingadorRevengeGrid"
                style="grid-template-columns:1fr;"
            ></div>

            <button
                class="btn btn-danger"
                id="btnConfirmRevenge"
                disabled
            >
                Confirmar Vingança
            </button>

            <button
                class="btn btn-secondary"
                style="margin-top:8px;"
                id="btnSkipRevenge"
            >
                Perdoar
            </button>
        `;


        const grid =
            document.getElementById(
                'vingadorRevengeGrid'
            );

        const btn =
            document.getElementById(
                'btnConfirmRevenge'
            );

        let selected = null;


        aliveOthers.forEach(player => {

            const chip =
                document.createElement('div');

            chip.className = 'player-chip';

            chip.innerHTML = `
                <span class="chip-icon">
                    ${CLASS_DEFS[player.role].icon}
                </span>

                <div class="player-chip-content">
                    <div class="player-chip-name">
                        ${player.name}
                    </div>
                </div>
            `;

            chip.onclick = () => {

                grid
                    .querySelectorAll('.player-chip')
                    .forEach(c =>
                        c.classList.remove('selected')
                    );

                chip.classList.add('selected');

                selected = player.name;

                btn.disabled = false;

            };

            grid.appendChild(chip);

        });


        btn.onclick = () => {

            if (!selected) return;

            const target =
                getPlayerByName(selected);

            if (target && target.alive) {

                killPlayer(
                    target,
                    'Vingança',
                    false,
                    false,
                    true
                );

                addLog(
                    `⚔️ ${vingadorPlayer.name} levou ${target.name} junto!`
                );

            }

            game.pendingVingadorRevenge = false;

            if (checkWinCondition()) return;

            if (game.phase === 'night') {

                game.nightStep++;

                renderGame();

            } else {

                proceedToNextNight();

            }

        };


        document.getElementById(
            'btnSkipRevenge'
        ).onclick = () => {

            game.pendingVingadorRevenge = false;

            if (game.phase === 'night') {

                game.nightStep++;

                renderGame();

            } else {

                proceedToNextNight();

            }

        };

    }


    /* =========================================================
       PERFIL DO JOGADOR
    ========================================================= */

    function openPlayerProfile(playerName) {

        game.profilePlayer = playerName;

        renderPlayerProfile(playerName);

        const panel =
            document.getElementById(
                'playerProfilePanel'
            );

        panel.style.display = '';

        panel.scrollIntoView({
            behavior: 'smooth',
            block: 'nearest'
        });

    }


    function closePlayerProfile() {

        game.profilePlayer = null;

        document.getElementById(
            'playerProfilePanel'
        ).style.display = 'none';

    }


    function renderPlayerProfile(playerName) {

        const player =
            getPlayerByName(playerName);

        if (!player) return;


        const panel =
            document.getElementById(
                'playerProfilePanel'
            );

        panel.style.display = '';


        const isLeader =
            game.players.length > 0 &&
            game.players[0].name === player.name;


        const inventoryHtml =
            player.inventory.length
                ? player.inventory.map(itemId => {

                    const item =
                        ITEM_DEFS[itemId];

                    return `
                        <span title="${item.name}">
                            ${item.icon}
                        </span>
                    `;

                }).join('')
                : `<span style="
                    color:var(--text-muted);
                    font-size:0.7em;
                ">
                    Nenhum item
                </span>`;


        panel.innerHTML = `

            <div class="profile-header">

                <div>

                    <div class="profile-name">
                        ${player.name}
                    </div>

                    ${
                        isLeader
                            ? `
                                <div class="leader-label">
                                    👑 Líder da partida
                                </div>
                            `
                            : ''
                    }

                </div>

                <button
                    class="btn btn-secondary"
                    style="
                        width:auto;
                        padding:8px 12px;
                        font-size:0.6em;
                    "
                    id="closeProfileBtn"
                >
                    Fechar
                </button>

            </div>


            <div class="profile-stat">

                <span>Estado</span>

                <span class="profile-stat-value">
                    ${player.alive ? '❤️ VIVO' : '💀 MORTO'}
                </span>

            </div>


            <div class="profile-stat">

                <span>🪙 Moedas</span>

                <span class="profile-stat-value">
                    ${player.coins || 0}
                </span>

            </div>


            <div class="profile-stat">

                <span>🎒 Itens</span>

                <span class="inventory-mini">
                    ${inventoryHtml}
                </span>

            </div>


            <!-- CONTROLE DO LÍDER -->

            <div class="section-title">
                👑 Gerenciamento do Líder
            </div>

            <div style="
                color:var(--text-muted);
                font-size:0.7em;
                margin-bottom:10px;
            ">
                Os controles abaixo são destinados ao líder da partida.
            </div>


            <div class="management-grid">

                <button
                    class="btn btn-success"
                    id="coinPlus5"
                >
                    🪙 +5
                </button>

                <button
                    class="btn btn-success"
                    id="coinPlus1"
                >
                    🪙 +1
                </button>

                <button
                    class="btn btn-danger"
                    id="coinMinus1"
                >
                    🪙 -1
                </button>

                <button
                    class="btn btn-danger"
                    id="coinMinus5"
                >
                    🪙 -5
                </button>

            </div>


            <div class="section-title">
                ❤️ Gerenciar Vida
            </div>


            <div class="management-grid">

                <button
                    class="btn btn-success"
                    id="revivePlayerBtn"
                    ${player.alive ? 'disabled' : ''}
                >
                    ❤️ REVIVER
                </button>

                <button
                    class="btn btn-danger"
                    id="killPlayerBtn"
                    ${!player.alive ? 'disabled' : ''}
                >
                    ☠️ MATAR
                </button>

            </div>


            ${
                game.phase === 'day'
                    ? renderStore(player)
                    : `
                        <div class="section-title">
                            🏪 Loja
                        </div>

                        <div class="item-use-note">
                            🌙 A loja só fica disponível durante o Dia.
                        </div>
                    `
            }


            <div class="section-title">
                📜 Missões
            </div>

            <div id="missionsContainer">
                ${renderMissions(player)}
            </div>

        `;


        document.getElementById(
            'closeProfileBtn'
        ).onclick = closePlayerProfile;


        /*
         * MOEDAS
         */

        document.getElementById(
            'coinPlus5'
        ).onclick = () =>
            changeCoins(player, 5);


        document.getElementById(
            'coinPlus1'
        ).onclick = () =>
            changeCoins(player, 1);


        document.getElementById(
            'coinMinus1'
        ).onclick = () =>
            changeCoins(player, -1);


        document.getElementById(
            'coinMinus5'
        ).onclick = () =>
            changeCoins(player, -5);


        /*
         * VIDA
         */

        document.getElementById(
            'revivePlayerBtn'
        ).onclick = () =>
            manualRevive(player);


        document.getElementById(
            'killPlayerBtn'
        ).onclick = () =>
            manualKill(player);


        /*
         * LOJA
         */

        if (game.phase === 'day') {

            document
                .querySelectorAll(
                    '[data-buy-item]'
                )
                .forEach(button => {

                    button.onclick = () => {

                        purchaseItem(
                            player.name,
                            button.dataset.buyItem
                        );

                    };

                });


            document
                .querySelectorAll(
                    '[data-use-item]'
                )
                .forEach(button => {

                    button.onclick = () => {

                        useItem(
                            player.name,
                            button.dataset.useItem
                        );

                    };

                });

        }


        /*
         * MISSÕES
         */

        document
            .querySelectorAll(
                '[data-complete-mission]'

    function renderMissions(player) {

        if (!player.missions) {
            player.missions = [];
        }


        return MISSIONS.map(mission => {

            const completed =
                player.missions.includes(
                    mission.id
                );


            return `

                <div class="
                    mission-card
                    ${completed ? 'completed' : ''}
                ">

                    <div class="mission-title">
                        ${mission.title}
                    </div>

                    <div class="mission-description">
                        ${mission.description}
                    </div>

                    <button
                        class="btn ${
                            completed
                                ? 'btn-secondary'
                                : 'btn-success'
                        }"
                        style="
                            margin-top:7px;
                            padding:8px;
                            font-size:0.6em;
                        "
                        data-complete-mission="${mission.id}"
                        ${completed ? 'disabled' : ''}
                    >
                        ${
                            completed
                                ? '✓ CONCLUÍDA'
                                : 'Marcar como concluída'
                        }
                    </button>

                </div>

            `;

        }).join('');

    }


    function completeMission(
        playerName,
        missionId
    ) {

        const player =
            getPlayerByName(playerName);

        if (!player) return;

        if (!player.missions) {
            player.missions = [];
        }


        if (
            player.missions.includes(
                missionId
            )
        ) {
            return;
        }


        player.missions.push(
            missionId
        );


        const mission =
            MISSIONS.find(
                m => m.id === missionId
            );


        addLog(
            `📜 ${player.name} concluiu a missão "${mission.title}".`
        );


        renderPlayerProfile(player.name);

    }


    /* =========================================================
       USO DE ITENS
    ========================================================= */

    function useItem(
        playerName,
        itemId
    ) {

        if (game.phase !== 'day') {

            alert(
                'Os itens só podem ser usados durante o Dia.'
            );

            return;

        }


        const player =
            getPlayerByName(playerName);

        if (!player) return;


        if (!hasItem(player, itemId)) {

            alert(
                'Esse jogador não possui esse item.'
            );

            return;

        }


        switch(itemId) {

            /* =========================================
               COLETE
            ========================================== */

            case 'colete': {

                consumeItem(
                    player,
                    itemId
                );

                if (
                    !game.shieldPlayers.includes(
                        player.name
                    )
                ) {

                    game.shieldPlayers.push(
                        player.name
                    );

                }

                addLog(
                    `🛡️ ${player.name} ativou o Colete para esta rodada.`
                );

                break;

            }


            /* =========================================
               LUPA
            ========================================== */

            case 'lupa': {

                const targets =
                    getAlivePlayers().filter(
                        p =>
                            p.name !== player.name
                    );


                if (!targets.length) {

                    alert(
                        'Não há outro jogador vivo para investigar.'
                    );

                    return;

                }


                showTargetSelection(
                    '🔍 Lupa do Detetive',
                    'Escolha quem será investigado.',
                    targets,
                    target => {

                        consumeItem(
                            player,
                            itemId
                        );


                        addLog(
                            `🔍 ${player.name} usou a Lupa para investigar ${target.name}.`
                        );


                        alert(
                            `${target.name} é ${CLASS_DEFS[target.role].name}${
                                target.subclass
                                    ? ` (${SUBCLASS_DEFS[target.subclass].name})`
                                    : ''
                            }.`
                        );


                        renderPlayerProfile(
                            player.name
                        );

                    }
                );

                return;

            }


            /* =========================================
               CORAÇÃO AMIGO
            ========================================== */

            case 'coracao': {

                const dead =
                    getDeadPlayers();


                if (!dead.length) {

                    alert(
                        'Não existe nenhum jogador morto.'
                    );

                    return;

                }


                showTargetSelection(
                    '❤️ Coração Amigo',
                    'Escolha quem será revivido.',
                    dead,
                    target => {

                        consumeItem(
                            player,
                            itemId
                        );


                        manualRevive(target);


                        addLog(
                            `❤️ ${player.name} usou o Coração Amigo para reviver ${target.name}.`
                        );


                        renderPlayerProfile(
                            player.name
                        );

                    }
                );

                return;

            }


            /* =========================================
               PÍLULA DA VIDA
            ========================================== */

            case 'pilula': {

                const targets =
                    getAlivePlayers();


                showTargetSelection(
                    '💊 Pílula da Vida',
                    'Escolha quem receberá proteção na próxima noite.',
                    targets,
                    target => {

                        consumeItem(
                            player,
                            itemId
                        );


                        if (
                            !game.doctorProtectionPlayers.includes(
                                target.name
                            )
                        ) {

                            game.doctorProtectionPlayers.push(
                                target.name
                            );

                        }


                        addLog(
                            `💊 ${player.name} protegeu ${target.name} com a Pílula da Vida.`
                        );


                        renderPlayerProfile(
                            player.name
                        );

                    }
                );

                return;

            }


            /* =========================================
               ROLETA
            ========================================== */

            case 'roleta': {

                const targets =
                    getAlivePlayers().filter(
                        p =>
                            p.name !== player.name
                    );


                if (!targets.length) {

                    alert(
                        'Não há outro jogador vivo para a Roleta.'
                    );

                    return;

                }


                showTargetSelection(
                    '🎰 Roleta Russa All Win',
                    'Escolha o adversário.',
                    targets,
                    target => {

                        consumeItem(
                            player,
                            itemId
                        );


                        const playerMoney =
                            player.coins || 0;

                        const targetMoney =
                            target.coins || 0;


                        const winnerIsPlayer =
                            Math.random() >= 0.5;


                        if (winnerIsPlayer) {

                            player.coins =
                                playerMoney +
                                targetMoney;

                            target.coins = 0;


                            killPlayer(
                                target,
                                'Roleta Russa',
                                true,
                                false,
                                true
                            );


                            addLog(
                                `🎰 ${player.name} venceu a Roleta contra ${target.name} e recebeu ${targetMoney} moedas.`
                            );

                        } else {

                            target.coins =
                                targetMoney +
                                playerMoney;

                            player.coins = 0;


                            killPlayer(
                                player,
                                'Roleta Russa',
                                true,
                                false,
                                true
                            );


                            addLog(
                                `🎰 ${target.name} venceu a Roleta contra ${player.name} e recebeu ${playerMoney} moedas.`
                            );

                        }


                        checkWinCondition();


                        renderPlayerProfile(
                            player.name
                        );

                        updateAlivePlayersGrid();
                        updateGraveyard();

                    }
                );

                return;

            }


            /* =========================================
               ALGEMA
            ========================================== */

            case 'algema': {

                const targets =
                    getAlivePlayers();


                showTargetSelection(
                    '⛓️ Algema',
                    'Escolha quem ficará impedido de votar e ser votado nesta rodada.',
                    targets,
                    target => {

                        consumeItem(
                            player,
                            itemId
                        );


                        game.handcuffedPlayer =
                            target.name;


                        addLog(
                            `⛓️ ${player.name} algemou ${target.name} nesta rodada.`
                        );


                        renderPlayerProfile(
                            player.name
                        );


                        updateMudoBanner();

                    }
                );

                return;

            }

        }


        renderPlayerProfile(
            player.name
        );

        updateAlivePlayersGrid();
        updateGraveyard();

    }

    /* =========================================================
       WIN CONDITION
    ========================================================= */

    function checkWinCondition() {

        const alive =
            getAlivePlayers();


        const assassinos =
            alive.filter(
                p =>
                    p.role === 'assassino'
            );


        const cidadaos =
            alive.filter(
                p =>
                    p.role !== 'assassino'
            );


        if (
            assassinos.length > 0 &&
            cidadaos.length === 0
        ) {

            game.winner =
                'assassino';

            game.phase =
                'gameover';

            endGame();

            return true;

        }


        if (
            assassinos.length === 0 &&
            cidadaos.length > 0
        ) {

            game.winner =
                'cidadaos';

            game.phase =
                'gameover';

            endGame();

            return true;

        }


        return false;

    }


    /* =========================================================
       CONFIGURAÇÃO
    ========================================================= */

    function renderSetup() {

        game.playerCount = 6;

        game.selectedSubclasses = [];

        game.players = [];

        game.currentRevealIndex = 0;

        game.revealed = false;

        game.phase = 'setup';

        game.nightStep = 0;

        game.dayStep = 0;

        game.nightTargets = {};

        game.lastSavedPlayer = null;

        game.mutedPlayer = null;

        game.eliminatedTonight = [];

        game.savedTonight = null;

        game.gameLog = [];

        game.round = 0;

        game.winner = null;

        game.pendingVingadorRevenge = false;

        game.isBlackout = false;

        game.detetiveUses = {};

        game.eletricistaUsed = false;

        game.balaMagicaUsed = false;

        game.lovers = [];

        game.amanteDeathTriggered = false;

        game.profilePlayer = null;

        game.shieldPlayers = [];

        game.doctorProtectionPlayers = [];

        game.handcuffedPlayer = null;

        resetStore();


        document.getElementById(
            'playerProfilePanel'
        ).style.display = 'none';


        const input =
            document.getElementById(
                'playerCountInput'
            );


        input.value = 6;


        input.oninput = function() {

            let value =
                parseInt(
                    this.value
                );


            if (
                isNaN(value) ||
                value < 5
            ) {
                value = 5;
            }


            if (value > 12) {
                value = 12;
            }


            game.playerCount =
                value;

            this.value =
                value;


            updateSubclassToggles();

            updateRoleSummary();

        };


        updateSubclassToggles();

        updateRoleSummary();


        /* ================================
           SORTEAR SUBCLASSES
        ================================= */

        document.getElementById(
            'btnRandomizeSubs'
        ).onclick = () => {

            const allSubs =
                Object.keys(
                    SUBCLASS_DEFS
                );


            let shuffled =
                shuffleArray(
                    allSubs
                );


            let selected = [];


            for (
                let i = 0;
                i < shuffled.length;
                i++
            ) {

                const sub =
                    shuffled[i];


                if (
                    sub === 'amante'
                ) {

                    if (
                        selected.length + 2 <=
                        game.playerCount
                    ) {

                        selected.push(
                            'amante'
                        );

                        selected.push(
                            'amante'
                        );

                    }

                } else {

                    if (
                        selected.length <
                        game.playerCount
                    ) {

                        selected.push(
                            sub
                        );

                    }

                }

            }


            game.selectedSubclasses =
                selected;


            updateSubclassToggles();

            updateRoleSummary();

        };


        /* ================================
           INICIAR
        ================================= */

        document.getElementById(
            'btnStartSetup'
        ).onclick = () => {

            if (
                game.playerCount < 5 ||
                game.playerCount > 12
            ) {

                alert(
                    'O número de jogadores deve estar entre 5 e 12.'
                );

                return;

            }


            let classes = [

                'assassino',

                'medico',

                'detetive'

            ];


            const cidadaoCount =
                game.playerCount - 3;


            for (
                let i = 0;
                i < cidadaoCount;
                i++
            ) {

                classes.push(
                    'cidadao'
                );

            }


            classes =
                shuffleArray(
                    classes
                );


            game.selectedClasses =
                classes;


            /*
             * Distribuição das subclasses
             */

            const subMap =
                new Array(
                    game.playerCount
                ).fill(null);


            let remaining =
                shuffleArray(
                    [...game.selectedSubclasses]
                );


            /*
             * Primeiro tenta colocar
             * subclasses exclusivas
             */

            for (
                let i = 0;
                i < game.playerCount;
                i++
            ) {

                const role =
                    classes[i];


                const validIndex =
                    remaining.findIndex(
                        sub => {

                            const def =
                                SUBCLASS_DEFS[sub];


                            if (
                                role === 'assassino'
                            ) {

                                return (
                                    def.restrictedTo ===
                                    'assassino'
                                );

                            }


                            return (
                                def.restrictedTo !==
                                'assassino'
                            );

                        }
                    );


                if (
                    validIndex !== -1
                ) {

                    subMap[i] =
                        remaining[
                            validIndex
                        ];

                    remaining.splice(
                        validIndex,
                        1
                    );

                }

            }


            /*
             * Tenta preencher os restantes
             * com universais
             */

            for (
                let i = 0;
                i < game.playerCount;
                i++
            ) {

                if (
                    subMap[i] !== null
                ) {
                    continue;
                }


                const validIndex =
                    remaining.findIndex(
                        sub =>
                            SUBCLASS_DEFS[sub]
                                .restrictedTo !==
                            'assassino'
                    );


                if (
                    validIndex !== -1 &&
                    classes[i] !== 'assassino'
                ) {

                    subMap[i] =
                        remaining[
                            validIndex
                        ];

                    remaining.splice(
                        validIndex,
                        1
                    );

                }

            }


            game.selectedSubclasses =
                subMap;


            game.phase =
                'names';


            renderNames();

            showScreen(
                'names'
            );

        };


        showScreen(
            'setup'
        );

    }


    /* =========================================================
       TOGGLES DE SUBCLASSES
    ========================================================= */

    function updateSubclassToggles() {

        const container =
            document.getElementById(
                'subclassToggles'
            );


        container.innerHTML =
            '';


        const categories = {

            '🔪 Exclusivas do Assassino': [
                'eletricista',
                'mudo',
                'detetive_corrupto'
            ],

            '👤 Para Cidadãos, Médicos e Detetives': [
                'vingador'
            ],

            '🌍 Universais': [
                'amante',
                'prefeito',
                'bala_magica',
                'bomba'
            ]

        };


        Object.entries(
            categories
        ).forEach(
            ([categoryName, keys]) => {


                const subtitle =
                    document.createElement(
                        'div'
                    );


                subtitle.style.cssText = `
                    font-size:0.8em;
                    color:var(--text-muted);
                    margin-top:10px;
                    margin-bottom:4px;
                    letter-spacing:1px;
                    text-transform:uppercase;
                `;


                subtitle.textContent =
                    categoryName;


                container.appendChild(
                    subtitle
                );


                keys.forEach(
                    key => {

                        const def =
                            SUBCLASS_DEFS[key];


                        const isActive =
                            game.selectedSubclasses
                                .includes(key);


                        const div =
                            document.createElement(
                                'div'
                            );


                        div.className =
                            `role-toggle ${
                                isActive
                                    ? 'active'
                                    : ''
                            }`;


                        div.innerHTML = `

                            <span class="role-toggle-icon">
                                ${def.icon}
                            </span>

                            <div class="role-toggle-info">

                                <div class="role-toggle-name">
                                    ${def.name}
                                </div>

                                <div class="role-toggle-desc">
                                    ${def.desc}
                                </div>

                            </div>

                            <span class="
                                role-toggle-badge
                                ${isActive ? 'badge-on' : ''}
                            ">
                                ${isActive ? 'ATIVO' : 'INATIVO'}
                            </span>

                        `;


                        div.onclick = () => {

                            if (
                                key === 'amante'
                            ) {

                                const count =
                                    game.selectedSubclasses
                                        .filter(
                                            sub =>
                                                sub ===
                                                'amante'
                                        ).length;


                                if (
                                    count >= 2
                                ) {

                                    let removed = 0;


                                    game.selectedSubclasses =
                                        game.selectedSubclasses
                                            .filter(
                                                sub => {

                                                    if (
                                                        sub === 'amante' &&
                                                        removed < 2
                                                    ) {

                                                        removed++;

                                                        return false;

                                                    }

                                                    return true;

                                                }
                                            );

                                } else {

                                    game.selectedSubclasses
                                        .push(
                                            'amante'
                                        );

                                    game.selectedSubclasses
                                        .push(
                                            'amante'
                                        );

                                }

                            } else {

                                if (
                                    game.selectedSubclasses
                                        .includes(
                                            key
                                        )
                                ) {

                                    game.selectedSubclasses =
                                        game.selectedSubclasses
                                            .filter(
                                                sub =>
                                                    sub !== key
                                            );

                                } else {

                                    game.selectedSubclasses
                                        .push(
                                            key
                                        );

                                }

                            }


                            updateSubclassToggles();

                            updateRoleSummary();

                        };


                        container.appendChild(
                            div
                        );

                    }
                );

            }
        );

    }


    function updateRoleSummary() {

        const summary =
            document.getElementById(
                'roleSummary'
            );


        const counts = {};


        game.selectedSubclasses.forEach(
            sub => {

                counts[sub] =
                    (counts[sub] || 0) + 1;

            }
        );


        const list =
            Object.keys(
                counts
            ).map(
                key => {

                    if (
                        key === 'amante'
                    ) {

                        return `
                            ${SUBCLASS_DEFS[key].icon}
                            (x${counts[key]})
                        `;

                    }


                    return (
                        SUBCLASS_DEFS[key].icon
                    );

                }
            );


        summary.textContent =
            `Total: ${game.playerCount} jog. | ${
                list.length
                    ? 'Subclasses: ' + list.join(' ')
                    : 'Nenhuma subclasse selecionada'
            }`;

    }
