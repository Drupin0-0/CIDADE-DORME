    function renderStore(player) {
        let html = `
            <div class="section-title">🏪 Loja Compartilhada</div>
            <div class="item-use-note">☀️ Loja aberta durante o Dia. ${ITEM_STOCK} unidades de cada item por partida.</div>
        `;

        Object.entries(ITEM_DEFS).forEach(([itemId, item]) => {
            const storeItem = game.store[itemId];
            const stock = storeItem ? storeItem.stock : ITEM_STOCK;
            const soldOut = stock <= 0;
            const owned = hasItem(player, itemId);

            html += `
                <div class="item-card ${soldOut ? 'purchased' : ''}">
                    <div class="item-card-header">
                        <span class="item-icon">${item.icon}</span>
                        <span class="item-name">${item.name}</span>
                        <span class="item-price">${item.price} 🪙</span>
                    </div>
                    <div class="item-description">${item.desc}</div>
                    <div style="color:var(--text-muted);font-size:0.6em;margin-bottom:3px;">
                        📦 Estoque: ${stock}/${ITEM_STOCK}${storeItem && storeItem.purchasedBy.length ? ` — Comprado por ${storeItem.purchasedBy.join(', ')}` : ''}
                    </div>
                    ${owned
                        ? `<button class="btn btn-primary" data-use-item="${itemId}">${item.icon} Usar Item</button>`
                        : `<button class="btn btn-secondary" data-buy-item="${itemId}" ${soldOut || player.coins < item.price ? 'disabled' : ''}>${soldOut ? 'Esgotado' : 'Comprar'}</button>`
                    }
                </div>
            `;
        });

        return html;
    }

    function useItem(playerName, itemId) {
        if (game.phase !== 'day') {
            alert('Os itens só podem ser usados durante o Dia.');
            return;
        }

        const player = getPlayerByName(playerName);
        if (!player || !hasItem(player, itemId)) return;

        switch(itemId) {
            case 'colete': {
                consumeItem(player, itemId);
                if (!game.shieldPlayers.includes(player.name)) game.shieldPlayers.push(player.name);
                addLog(`🛡️ ${player.name} ativou o Colete.`);
                break;
            }
            case 'lupa': {
                const targets = getAlivePlayers().filter(p => p.name !== player.name);
                if (!targets.length) {
                    alert('Não há outro jogador vivo para investigar.');
                    return;
                }
                showTargetSelection('🔍 Lupa do Detetive', 'Escolha quem será investigado.', targets, target => {
                    consumeItem(player, itemId);
                    addLog(`🔍 ${player.name} usou Lupa em ${target.name}.`);
                    alert(`${target.name} é ${CLASS_DEFS[target.role].name}${target.subclass ? ` (${SUBCLASS_DEFS[target.subclass].name})` : ''}.`);
                    renderPlayerProfile(player.name);
                });
                return;
            }
            case 'coracao': {
                const dead = getDeadPlayers();
                if (!dead.length) {
                    alert('Não existe nenhum jogador morto.');
                    return;
                }
                showTargetSelection('❤️ Coração Amigo', 'Escolha quem será revivido.', dead, target => {
                    consumeItem(player, itemId);
                    manualRevive(target);
                    addLog(`❤️ ${player.name} reviveu ${target.name}.`);
                    renderPlayerProfile(player.name);
                });
                return;
            }
            case 'pilula': {
                const targets = getAlivePlayers();
                showTargetSelection('💊 Pílula da Vida', 'Escolha quem receberá proteção na próxima noite.', targets, target => {
                    consumeItem(player, itemId);
                    if (!game.doctorProtectionPlayers.includes(target.name)) game.doctorProtectionPlayers.push(target.name);
                    addLog(`💊 ${player.name} protegeu ${target.name}.`);
                    renderPlayerProfile(player.name);
                });
                return;
            }
            case 'roleta': {
                const targets = getAlivePlayers().filter(p => p.name !== player.name);
                if (!targets.length) {
                    alert('Não há outro jogador vivo para a Roleta.');
                    return;
                }
                showTargetSelection('🎰 Roleta Russa All Win', 'Escolha o adversário para o duelo mortal.', targets, target => {
                    startRoletaRussaDuel(player, target);
                });
                return;
            }
            case 'algema': {
                const targets = getAlivePlayers();
                showTargetSelection('⛓️ Algema', 'Escolha quem não poderá votar nem ser votado.', targets, target => {
                    consumeItem(player, itemId);
                    game.handcuffedPlayer = target.name;
                    addLog(`⛓️ ${player.name} algemou ${target.name}.`);
                    renderPlayerProfile(player.name);
                    updateMudoBanner();
                });
                return;
            }
            case 'faca': {
                const targets = getAlivePlayers().filter(p => p.name !== player.name);
                if (!targets.length) {
                    alert('Não há outro jogador vivo para atacar.');
                    return;
                }
                showTargetSelection('🔪 Faca', 'Escolha quem será morto.', targets, target => {
                    consumeItem(player, itemId);
                    addLog(`🔪 ${player.name} usou a Faca em ${target.name}.`);
                    killPlayer(target, 'Faca', true, false, false);
                    checkWinCondition();
                    renderPlayerProfile(player.name);
                    updateAlivePlayersGrid();
                    updateGraveyard();
                });
                return;
            }
        }

        renderPlayerProfile(player.name);
        updateAlivePlayersGrid();
        updateGraveyard();
    }

    function showTargetSelection(title, description, targets, callback) {
        const mainCard = document.getElementById('gameMainCard');
        const original = mainCard.innerHTML;

        mainCard.innerHTML = `
            <div style="text-align:center;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:10px;">
                <div style="font-size:2em;">🎯</div>
                <div style="font-weight:700;font-family:var(--font-serif);font-size:0.9em;">${title}</div>
                <div style="color:var(--text-muted);font-size:0.7em;">${description}</div>
            </div>
            <div class="player-grid" id="itemTargetGrid"></div>
            <button class="btn btn-primary" id="confirmItemTarget" disabled>Confirmar</button>
            <button class="btn btn-secondary" style="margin-top:6px;" id="cancelItemTarget">Cancelar</button>
        `;

        const grid = document.getElementById('itemTargetGrid');
        const confirm = document.getElementById('confirmItemTarget');
        const cancel = document.getElementById('cancelItemTarget');
        let selected = null;

        targets.forEach(target => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';
            chip.innerHTML = `
                <span class="chip-icon">${CLASS_DEFS[target.role].icon}</span>
                <div class="player-chip-content">
                    <div class="player-chip-name">${target.name}</div>
                </div>
            `;
            chip.onclick = () => {
                grid.querySelectorAll('.player-chip').forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
                selected = target;
                confirm.disabled = false;
            };
            grid.appendChild(chip);
        });

        confirm.onclick = () => {
            if (!selected) return;
            callback(selected);
            if (game.phase !== 'gameover' && !mainCard.querySelector('.dice-scene')) renderGame();
        };

        cancel.onclick = () => {
            mainCard.innerHTML = original;
            renderGame();
        };
    }

    function checkWinCondition() {
        const alive = getAlivePlayers();
        const assassinos = alive.filter(p => p.role === 'assassino');
        const cidadaos = alive.filter(p => p.role !== 'assassino');

        if (assassinos.length > 0 && cidadaos.length === 0) {
            game.winner = 'assassino';
            game.phase = 'gameover';
            endGame();
            return true;
        }

        if (assassinos.length >= cidadaos.length && assassinos.length > 0) {
            game.winner = 'assassino';
            game.phase = 'gameover';
            endGame();
            return true;
        }

        if (assassinos.length === 0 && cidadaos.length > 0) {
            game.winner = 'cidadaos';
            game.phase = 'gameover';
            endGame();
            return true;
        }

        return false;
    }

    function renderSetup() {
        game.playerCount = 6;
        game.selectedSubclasses = [];
        game.players = [];
        game.currentRevealIndex = 0;
        game.revealed = false;
        game.phase = 'setup';
        game.nightStep = 0;
        game.dayStep = 0;
        game.nightTargets = {};
        game.lastSavedPlayer = null;
        game.mutedPlayer = null;
        game.eliminatedTonight = [];
        game.savedTonight = null;
        game.gameLog = [];
        game.round = 0;
        game.winner = null;
        game.pendingVingadorRevenge = false;
        game.pendingAngelRevival = false;
        game.isBlackout = false;
        game.detetiveUses = {};
        game.eletricistaUsed = false;
        game.balaMagicaUsed = {};
        game.lovers = [];
        game.amanteDeathTriggered = false;
        game.profilePlayer = null;
        game.shieldPlayers = [];
        game.doctorProtectionPlayers = [];
        game.handcuffedPlayer = null;
        resetStore();

        document.getElementById('playerProfilePanel').style.display = 'none';

        const input = document.getElementById('playerCountInput');
        input.value = 6;

        input.oninput = function() {
            let value = parseInt(this.value);
            if (isNaN(value) || value < 5) value = 5;
            if (value > 24) value = 24;
            game.playerCount = value;
            this.value = value;
            updateSubclassToggles();
            updateRoleSummary();
        };

        updateSubclassToggles();
        updateRoleSummary();

        document.getElementById('btnRandomizeSubs').onclick = () => {
            const allSubs = Object.keys(SUBCLASS_DEFS);
            let shuffled = shuffleArray(allSubs);
            let selected = [];

            for (let i = 0; i < shuffled.length; i++) {
                const sub = shuffled[i];
                if (sub === 'amante') {
                    if (selected.length + 2 <= game.playerCount) {
                        selected.push('amante');
                        selected.push('amante');
                    }
                } else {
                    if (selected.length < game.playerCount) selected.push(sub);
                }
            }

            game.selectedSubclasses = selected;
            updateSubclassToggles();
            updateRoleSummary();
        };

        document.getElementById('btnStartSetup').onclick = () => {
            if (game.playerCount < 5 || game.playerCount > 24) {
                alert('O número de jogadores deve estar entre 5 e 24.');
                return;
            }

            let classes = ['assassino', 'medico', 'detetive'];
            const cidadaoCount = game.playerCount - 3;
            for (let i = 0; i < cidadaoCount; i++) classes.push('cidadao');
            classes = shuffleArray(classes);
            game.selectedClasses = classes;

            const subMap = new Array(game.playerCount).fill(null);
            let remaining = shuffleArray([...game.selectedSubclasses]);

            for (let i = 0; i < game.playerCount; i++) {
                const role = classes[i];
                const validIndex = remaining.findIndex(sub => {
                    const def = SUBCLASS_DEFS[sub];
                    if (role === 'assassino') return def.restrictedTo === 'assassino';
                    return def.restrictedTo !== 'assassino';
                });
                if (validIndex !== -1) {
                    subMap[i] = remaining[validIndex];
                    remaining.splice(validIndex, 1);
                }
            }

            for (let i = 0; i < game.playerCount; i++) {
                if (subMap[i] !== null) continue;
                const validIndex = remaining.findIndex(sub => SUBCLASS_DEFS[sub].restrictedTo !== 'assassino');
                if (validIndex !== -1 && classes[i] !== 'assassino') {
                    subMap[i] = remaining[validIndex];
                    remaining.splice(validIndex, 1);
                }
            }

            game.selectedSubclasses = subMap;
            game.phase = 'names';
            renderNames();
            showScreen('names');
        };

        showScreen('setup');
    }

    function updateSubclassToggles() {
        const container = document.getElementById('subclassToggles');
        container.innerHTML = '';

        const categories = {
            '🔪 Exclusivas do Assassino': ['eletricista', 'mudo', 'detetive_corrupto'],
            '👤 Para Cidadãos, Médicos e Detetives': ['vingador', 'anjo'],
            '🌍 Universais': ['amante', 'prefeito', 'bala_magica', 'bomba']
        };

        Object.entries(categories).forEach(([categoryName, keys]) => {
            const subtitle = document.createElement('div');
            subtitle.style.cssText = `font-size:0.7em;color:var(--text-muted);margin-top:6px;margin-bottom:2px;letter-spacing:1px;text-transform:uppercase;`;
            subtitle.textContent = categoryName;
            container.appendChild(subtitle);

            keys.forEach(key => {
                const def = SUBCLASS_DEFS[key];
                const isActive = game.selectedSubclasses.includes(key);
                const div = document.createElement('div');
                div.className = `role-toggle ${isActive ? 'active' : ''}`;
                div.innerHTML = `
                    <span class="role-toggle-icon">${def.icon}</span>
                    <div class="role-toggle-info">
                        <div class="role-toggle-name">${def.name}</div>
                        <div class="role-toggle-desc">${def.desc}</div>
                    </div>
                    <span class="role-toggle-badge ${isActive ? 'badge-on' : ''}">${isActive ? 'ATIVO' : 'INATIVO'}</span>
                `;

                div.onclick = () => {
                    if (key === 'amante') {
                        const count = game.selectedSubclasses.filter(sub => sub === 'amante').length;
                        if (count >= 2) {
                            let removed = 0;
                            game.selectedSubclasses = game.selectedSubclasses.filter(sub => {
                                if (sub === 'amante' && removed < 2) {
                                    removed++;
                                    return false;
                                }
                                return true;
                            });
                        } else {
                            game.selectedSubclasses.push('amante');
                            game.selectedSubclasses.push('amante');
                        }
                    } else {
                        if (game.selectedSubclasses.includes(key)) {
                            game.selectedSubclasses = game.selectedSubclasses.filter(sub => sub !== key);
                        } else {
                            game.selectedSubclasses.push(key);
                        }
                    }
                    updateSubclassToggles();
                    updateRoleSummary();
                };

                container.appendChild(div);
            });
        });
    }

    function updateRoleSummary() {
        const summary = document.getElementById('roleSummary');
        const counts = {};
        game.selectedSubclasses.forEach(sub => {
            counts[sub] = (counts[sub] || 0) + 1;
        });

        const list = Object.keys(counts).map(key => {
            if (key === 'amante') return `${SUBCLASS_DEFS[key].icon} (x${counts[key]})`;
            return SUBCLASS_DEFS[key].icon;
        });

        summary.textContent = `Total: ${game.playerCount} jog. | ${list.length ? 'Subclasses: ' + list.join(' ') : 'Nenhuma subclasse selecionada'}`;
    }

    function renderNames() {
        const container = document.getElementById('nameInputs');
        container.innerHTML = '';

        for (let i = 0; i < game.playerCount; i++) {
            const group = document.createElement('div');
            group.className = 'name-input-group';
            group.innerHTML = `
                <span class="name-input-num">#${i + 1}</span>
                <input type="text" placeholder="Nome ${i + 1}" data-index="${i}" maxlength="20">
            `;
            container.appendChild(group);
        }

        document.getElementById('btnDistributeRoles').onclick = () => {
            const inputs = container.querySelectorAll('input');
            const names = Array.from(inputs).map((input, index) => input.value.trim() || `Jogador ${index + 1}`);

            game.players = names.map((name, index) => {
                const role = game.selectedClasses[index];

                return {
                    name,
                    role,
                    subclass: game.selectedSubclasses[index] || null,
                    alive: true,
                    coins: 0,
                    inventory: []
                };
            });

            const amantes = game.players.filter(player => player.subclass === 'amante');
            if (amantes.length >= 2) {
                game.lovers = [amantes[0].name, amantes[1].name];
                addLog(`💘 ${amantes[0].name} e ${amantes[1].name} estão apaixonados!`);
            }

            game.players.filter(p => p.subclass === 'detetive_corrupto').forEach(p => {
                game.detetiveUses[p.name] = 2;
            });

            game.currentRevealIndex = 0;
            game.revealed = false;
            game.phase = 'reveal';
            renderReveal();
            showScreen('reveal');
        };

        document.getElementById('btnBackToSetup').onclick = () => renderSetup();
    }

    function triggerCardReveal() {
        if (game.revealed) return;
        game.revealed = true;

        const player = game.players[game.currentRevealIndex];
        const card = document.getElementById('revealCard');
        const roleDef = CLASS_DEFS[player.role];
        const subDef = player.subclass ? SUBCLASS_DEFS[player.subclass] : null;

        card.classList.add('revealed');
        card.querySelector('.reveal-icon').textContent = roleDef.icon;
        card.querySelector('.reveal-text').style.display = 'none';

        const roleName = card.querySelector('.reveal-role-name');
        roleName.textContent = `${roleDef.name} ${subDef ? '· ' + subDef.icon : ''}`;
        roleName.style.display = '';
        roleName.style.color = roleDef.team === 'assassino' ? '#d65d5d' : '#80dba0';

        const subName = card.querySelector('.reveal-sub-name');
        if (subDef) {
            subName.textContent = `Subclasse: ${subDef.name}`;
            subName.style.display = '';
        } else {
            subName.style.display = 'none';
        }

        const roleDesc = card.querySelector('.reveal-role-desc');
        roleDesc.innerHTML = `${roleDef.desc}${subDef ? `<br><br>🛠️ <strong>Poder:</strong> ${subDef.desc}` : ''}`;
        roleDesc.style.display = '';

        const nextButton = document.getElementById(game.currentRevealIndex < game.players.length - 1 ? 'btnNextReveal' : 'btnStartGameAfterReveal');
        nextButton.style.display = '';
    }

    function nextRevealOrStart() {
        if (!game.revealed) {
            triggerCardReveal();
        } else {
            if (game.currentRevealIndex < game.players.length - 1) {
                game.currentRevealIndex++;
                renderReveal();
            } else {
                game.phase = 'night';
                game.round = 1;
                game.nightStep = 0;
                game.nightTargets = {};
                game.mutedPlayer = null;
                game.isBlackout = false;
                addLog('🌙 A primeira noite começa...');
                renderGame();
                showScreen('game');
            }
        }
    }

    function renderReveal() {
        const index = game.currentRevealIndex;
        const player = game.players[index];

        document.getElementById('revealPlayerNum').textContent = index + 1;
        document.getElementById('revealPlayerName').textContent = player.name;
        document.getElementById('revealProgress').textContent = `${index + 1} / ${game.players.length}`;

        const card = document.getElementById('revealCard');
        card.classList.remove('revealed');
        card.querySelector('.reveal-icon').textContent = '🃏';
        card.querySelector('.reveal-icon').style.display = '';
        card.querySelector('.reveal-text').textContent = 'Toque para ver seu destino';
        card.querySelector('.reveal-text').style.display = '';
        card.querySelector('.reveal-role-name').style.display = 'none';
        card.querySelector('.reveal-sub-name').style.display = 'none';
        card.querySelector('.reveal-role-desc').style.display = 'none';

        document.getElementById('btnNextReveal').style.display = 'none';
        document.getElementById('btnStartGameAfterReveal').style.display = 'none';

        game.revealed = false;

        card.onclick = () => triggerCardReveal();
        document.getElementById('btnNextReveal').onclick = () => nextRevealOrStart();
        document.getElementById('btnStartGameAfterReveal').onclick = () => nextRevealOrStart();
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
            if (game.phase === 'reveal') {
                e.preventDefault();
                nextRevealOrStart();
            }
        }
    });

    function renderGame() {
        updatePhaseIndicator();
        updateAlivePlayersGrid();
        updateGraveyard();
        updateMudoBanner();
        updateGameLog();

        const mainCard = document.getElementById('gameMainCard');

        if (game.phase === 'night') {
            renderNightPhase(mainCard);
        } else if (game.phase === 'day') {
            renderDayPhase(mainCard);
        }

        if (game.profilePlayer) {
            renderPlayerProfile(game.profilePlayer);
        }
    }

    function updatePhaseIndicator() {
        const element = document.getElementById('phaseIndicator');
        element.className = `game-phase-indicator ${game.phase === 'night' ? 'phase-night' : 'phase-day'}`;
        element.innerHTML = game.phase === 'night' ? `🌙 Noite — Rodada ${game.round}` : `☀️ Dia — Rodada ${game.round}`;
    }

    function updateAlivePlayersGrid() {
        const grid = document.getElementById('alivePlayersGrid');
        grid.innerHTML = '';

        getAlivePlayers().forEach(player => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';

            const classIcon = CLASS_DEFS[player.role].icon;
            const subIcon = player.subclass ? SUBCLASS_DEFS[player.subclass].icon : '';
            const inventory = player.inventory.map(itemId => `<span title="${ITEM_DEFS[itemId].name}">${ITEM_DEFS[itemId].icon}</span>`).join('');

            chip.innerHTML = `
                <span class="chip-icon">${classIcon} ${subIcon}</span>
                <div class="player-chip-content">
                    <div class="player-chip-name">${player.name}</div>
                    <div class="player-chip-coins">🪙 ${player.coins || 0}</div>
                    <div class="inventory-mini">${inventory || '<span>Sem itens</span>'}</div>
                </div>
            `;
            chip.onclick = () => openPlayerProfile(player.name);
            grid.appendChild(chip);
        });

        if (!getAlivePlayers().length) {
            grid.innerHTML = '<span style="color:var(--text-muted);font-size:0.75em;">Nenhum vivo</span>';
        }
    }

    function updateGraveyard() {
        const grave = document.getElementById('graveyard');
        const dead = getDeadPlayers();

        grave.innerHTML = dead.length
            ? dead.map(player => {
                const classIcon = CLASS_DEFS[player.role].icon;
                const subIcon = player.subclass ? SUBCLASS_DEFS[player.subclass].icon : '';
                return `
                    <div class="graveyard-chip" data-profile="${player.name}">
                        ${classIcon} ${subIcon} ${player.name}
                        <span style="color:var(--accent);margin-left:2px;">🪙${player.coins || 0}</span>
                    </div>
                `;
            }).join('')
            : '<span style="color:#444;font-size:0.65em;">Vazio</span>';

        grave.querySelectorAll('[data-profile]').forEach(element => {
            element.onclick = () => openPlayerProfile(element.dataset.profile);
        });
    }

    function updateMudoBanner() {
        const banner = document.getElementById('mudoBanner');
        if (game.mutedPlayer && game.phase === 'day') {
            const player = getPlayerByName(game.mutedPlayer);
            if (player && player.alive) {
                banner.style.display = '';
                banner.innerHTML = `🤫 <strong>${player.name}</strong> está silenciado pelo Mudo (pode ser votado).`;
            } else {
                banner.style.display = 'none';
            }
        } else {
            banner.style.display = 'none';
        }
    }

    function updateGameLog() {
        const log = document.getElementById('gameLog');
        log.innerHTML = game.gameLog.slice(-15).map(entry => `<div class="log-entry">${entry}</div>`).join('');
        log.scrollTop = log.scrollHeight;
    }

    function renderNightPhase(mainCard) {
        const assassino = getAssassino();
        const medico = getMedico();
        const detetive = getDetetive();
        const mudo = getMudo();
        const detetiveCorrupto = getDetetiveCorrupto();
        const corruptUsesLeft = detetiveCorrupto ? (game.detetiveUses[detetiveCorrupto.name] || 0) : 0;

        const steps = [];
        if (assassino) steps.push('assassino');
        if (mudo) steps.push('mudo');
        if (detetiveCorrupto && corruptUsesLeft > 0) steps.push('detetive_corrupto');
        if (medico && !game.isBlackout) steps.push('medico');
        if (detetive) steps.push('detetive');
        steps.push('resolve');

        if (game.nightStep >= steps.length) {
            resolveNight();
            return;
        }

        const role = steps[game.nightStep];
        const titles = {
            assassino: ['🔪', 'Assassino, escolha sua vítima.'],
            medico: ['💊', 'Médico, quem você protege?'],
            detetive: ['🔍', 'Detetive, escolha quem deseja investigar.'],
            mudo: ['🤫', 'Mudo, silencie um jogador (ou a si mesmo).'],
            detetive_corrupto: ['🔍', `Detetive Corrupto, escolha quem investigar. (${corruptUsesLeft} restante${corruptUsesLeft === 1 ? '' : 's'})`]
        };

        const skippableRoles = {
            mudo: 'Não silenciar ninguém',
            detetive_corrupto: 'Não investigar esta noite'
        };
        const skipButtonHtml = skippableRoles[role]
            ? `<button class="btn btn-secondary" id="btnSkipNightAction" style="margin-top:6px;">${skippableRoles[role]}</button>`
            : '';

        mainCard.innerHTML = `
            <div style="text-align:center;padding:12px 0;margin-bottom:10px;border-bottom:1px solid var(--border);">
                <div style="font-size:2em;">${titles[role][0]}</div>
                <div style="font-weight:700;margin:2px 0;font-family:var(--font-serif);font-size:0.9em;">${titles[role][1]}</div>
            </div>
            <div class="player-grid" id="nightSelectGrid"></div>
            <button class="btn btn-primary" id="btnNightAction" disabled>Confirmar</button>
            ${skipButtonHtml}
        `;

        if (document.getElementById('btnSkipNightAction')) {
            document.getElementById('btnSkipNightAction').onclick = () => {
                if (role === 'mudo') {
                    addLog('🤫 Mudo optou por não silenciar ninguém.');
                } else if (role === 'detetive_corrupto') {
                    addLog('🔍 Detetive Corrupto optou por não investigar esta noite.');
                }
                game.nightStep++;
                renderGame();
            };
        }

        setupNightSelection(role);
    }

    function setupNightSelection(role) {
        const grid = document.getElementById('nightSelectGrid');
        const btn = document.getElementById('btnNightAction');
        let selected = null;

        let available = getAlivePlayers().filter(player => {
            if (role === 'assassino' && player.role === 'assassino') return false;
            if (role === 'medico' && game.lastSavedPlayer === player.name) return false;
            if (role === 'detetive' && player.role === 'detetive') return false;
            if (role === 'detetive_corrupto' && player.subclass === 'detetive_corrupto') return false;
            return true;
        });

        available.forEach(player => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';
            chip.innerHTML = `
                <span class="chip-icon">${CLASS_DEFS[player.role].icon}</span>
                <div class="player-chip-content">
                    <div class="player-chip-name">${player.name}</div>
                </div>
            `;

            chip.onclick = () => {
                grid.querySelectorAll('.player-chip').forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
                selected = player.name;
                btn.disabled = false;
            };

            grid.appendChild(chip);
        });

        btn.onclick = () => {
            if (!selected) return;

            if (role === 'assassino') {
                game.nightTargets.assassino = selected;
                addLog('🔪 Assassino agiu.');
            } else if (role === 'medico') {
                game.nightTargets.medico = selected;
                addLog(`💊 Médico protegeu ${selected}.`);
            } else if (role === 'detetive') {
                game.nightTargets.detetiveCivil = selected;
                addLog(`🔍 Detetive investigou ${selected}.`);
            } else if (role === 'mudo') {
                game.mutedPlayer = selected;
                addLog(`🤫 Mudo silenciou ${selected}.`);
            } else if (role === 'detetive_corrupto') {
                const corrupto = getDetetiveCorrupto();
                const target = getPlayerByName(selected);
                if (corrupto && target) {
                    game.detetiveUses[corrupto.name] = Math.max(0, (game.detetiveUses[corrupto.name] || 0) - 1);
                    addLog(`🔍 ${corrupto.name} (Det. Corrupto) investigou ${target.name}.`);
                    showCorruptDetectiveResult(target);
                } else {
                    game.nightStep++;
                    renderGame();
                }
                return;
            }

            game.nightStep++;
            renderGame();
        };
    }

    function showCorruptDetectiveResult(target) {
        const mainCard = document.getElementById('gameMainCard');
        mainCard.innerHTML = `
            <div style="text-align:center;padding:12px 0;margin-bottom:10px;border-bottom:1px solid var(--border);">
                <div style="font-size:2em;">🔍</div>
                <div style="font-weight:700;margin:2px 0;font-family:var(--font-serif);font-size:0.9em;">Resultado da Investigação</div>
            </div>
            <div class="result-banner result-info">
                <strong>${target.name}</strong> é <strong>${CLASS_DEFS[target.role].name}</strong>${target.subclass ? ` (${SUBCLASS_DEFS[target.subclass].name})` : ''}.
            </div>
            <button class="btn btn-primary" id="btnContinueCorruptResult">Continuar</button>
        `;
        document.getElementById('btnContinueCorruptResult').onclick = () => {
            game.nightStep++;
            renderGame();
        };
    }

    function resolveNight() {
        const mainCard = document.getElementById('gameMainCard');
        game.eliminatedTonight = [];
        game.savedTonight = null;
        let resultsHtml = '';

        const assassinTarget = getPlayerByName(game.nightTargets.assassino);
        const doctorTarget = game.nightTargets.medico;

        if (assassinTarget && assassinTarget.alive) {
            const protectedByDoctor = doctorTarget === assassinTarget.name && !game.isBlackout;
            const protectedByPill = game.doctorProtectionPlayers.includes(assassinTarget.name);

            if (protectedByDoctor || protectedByPill) {
                game.savedTonight = assassinTarget.name;
                game.lastSavedPlayer = assassinTarget.name;
                game.doctorProtectionPlayers = game.doctorProtectionPlayers.filter(name => name !== assassinTarget.name);

                resultsHtml += `
                    <div class="result-banner result-safe">
                        💊 <strong>${assassinTarget.name}</strong> foi salvo!
                    </div>
                `;
                addLog(`💊 ${assassinTarget.name} foi salvo na noite.`);
            } else {
                const died = killPlayer(assassinTarget, 'Assassino', true, false);
                if (died) {
                    game.eliminatedTonight.push(assassinTarget);
                    resultsHtml += `
                        <div class="result-banner result-death">
                            🔪 <strong>${assassinTarget.name}</strong> foi morto!
                        </div>
                    `;
                }
            }
        }

        if (game.nightTargets.detetiveCivil) {
            const target = getPlayerByName(game.nightTargets.detetiveCivil);
            if (target) {
                const isAssassin = target.role === 'assassino';
                resultsHtml += `
                    <div class="result-banner result-info">
                        🔍 Detetive investigou <strong>${target.name}</strong>:
                        ${isAssassin ? '⚠️ É O ASSASSINO!' : '✅ É Inocente.'}
                    </div>
                `;
            }
        }

        if (game.eliminatedTonight.length === 0 && !game.savedTonight) {
            resultsHtml += `
                <div class="result-banner result-safe">
                    🌙 Noite tranquila. Ninguém morreu.
                </div>
            `;
        }

        if (checkWinCondition()) return;
        if (game.pendingVingadorRevenge) return;
        if (game.pendingAngelRevival) return;

        game.isBlackout = false;
        game.phase = 'day';
        game.dayStep = 0;
        game.nightStep = 0;
        game.nightTargets = {};

        addLog('☀️ O dia amanheceu...');

        mainCard.innerHTML = resultsHtml + `
            <div style="text-align:center;margin-top:10px;">
                <button class="btn btn-primary" id="btnStartDay">
                    ☀️ Iniciar Dia
                </button>
            </div>
        `;

        document.getElementById('btnStartDay').onclick = () => {
            game.dayStep = 1;
            renderGame();
        };

        updateAlivePlayersGrid();
        updateGraveyard();
        updateMudoBanner();
        updatePhaseIndicator();
    }

    function renderDayPhase(mainCard) {
        if (game.dayStep === 0) {
            mainCard.innerHTML = `
                <div style="text-align:center;padding:14px;">
                    <button class="btn btn-primary" id="btnStartDay">☀️ Iniciar Dia</button>
                </div>
            `;
            document.getElementById('btnStartDay').onclick = () => {
                game.dayStep = 1;
                renderGame();
            };
            return;
        }

        if (game.dayStep === 1) {
            const electrician = getEletricista();

            let actions = `
                <button class="btn btn-danger" id="btnStartVoting">
                    🗳️ Votar
                </button>
            `;

            if (electrician && !game.eletricistaUsed) {
                actions += `
                    <button class="btn btn-secondary" id="btnEletricista" style="margin-top:6px;">
                        ⚡ Apagar Luzes (1 uso no jogo)
                    </button>
                `;
            }

            mainCard.innerHTML = `
                <div style="text-align:center;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:10px;">
                    <div style="font-size:2em;">💬</div>
                    <div style="font-weight:700;margin:2px 0;font-family:var(--font-serif);font-size:0.9em;">Discussão do Dia</div>
                    <div style="color:var(--text-muted);font-size:0.72em;">
                        Abra o perfil dos jogadores para conferir itens e poderes.
                    </div>
                </div>
                <div style="display:flex;flex-direction:column;gap:6px;">
                    ${actions}
                </div>
            `;

            document.getElementById('btnStartVoting').onclick = () => {
                game.dayStep = 2;
                renderGame();
            };

            if (electrician && !game.eletricistaUsed) {
                document.getElementById('btnEletricista').onclick = () => {
                    game.eletricistaUsed = true;
                    game.isBlackout = true;
                    addLog(`⚡ ${electrician.name} acionou Apagão.`);
                    proceedToNextNight();
                };
            }
        }

        if (game.dayStep === 2) {
            mainCard.innerHTML = `
                <div style="text-align:center;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:10px;">
                    <div style="font-size:2em;">🗳️</div>
                    <div style="font-weight:700;font-family:var(--font-serif);font-size:0.9em;">Votação Final</div>
                    <div style="color:var(--text-muted);font-size:0.7em;">Escolha quem será eliminado.</div>
                </div>
                <div class="player-grid" id="voteSelectGrid"></div>
                <button class="btn btn-danger" id="btnConfirmVote" disabled>Eliminar</button>
                <button class="btn btn-secondary" style="margin-top:6px;" id="btnSkipVote">Empate / Ninguém</button>
            `;

            setupVoteSelection();
        }

        updateAlivePlayersGrid();
        updateGraveyard();
        updateMudoBanner();
    }

    function setupVoteSelection() {
        const grid = document.getElementById('voteSelectGrid');
        const button = document.getElementById('btnConfirmVote');
        let selected = null;

        const alive = getAlivePlayers().filter(player => player.name !== game.handcuffedPlayer);

        alive.forEach(player => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';
            chip.innerHTML = `
                <span class="chip-icon">${CLASS_DEFS[player.role].icon}</span>
                <div class="player-chip-content">
                    <div class="player-chip-name">${player.name}</div>
                    <div class="player-chip-coins">🪙 ${player.coins || 0}</div>
                </div>
            `;

            chip.onclick = () => {
                grid.querySelectorAll('.player-chip').forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
                selected = player.name;
                button.disabled = false;
            };

            grid.appendChild(chip);
        });

        button.onclick = () => {
            if (selected) resolveVote(selected);
        };

        document.getElementById('btnSkipVote').onclick = () => {
            addLog('🗳️ Ninguém eliminado na votação.');
            proceedToNextNight();
        };
    }

    function resolveVote(eliminatedName) {
        const target = getPlayerByName(eliminatedName);
        if (!target || !target.alive) return;

        if (game.shieldPlayers.includes(target.name)) {
            game.shieldPlayers = game.shieldPlayers.filter(name => name !== target.name);
            addLog(`🛡️ Colete salvou ${target.name} da votação!`);

            document.getElementById('gameMainCard').innerHTML = `
                <div class="result-banner result-safe">
                    🛡️ <strong>${target.name}</strong> foi protegido pelo Colete!
                </div>
                <button class="btn btn-primary" id="continueAfterShield">Continuar</button>
            `;

            document.getElementById('continueAfterShield').onclick = () => proceedToNextNight();
            return;
        }

        killPlayer(target, 'Votação', true, true);
        addLog(`🗳️ ${target.name} foi eliminado pela votação.`);

        const mainCard = document.getElementById('gameMainCard');
        let resultHtml = `
            <div class="result-banner result-death">
                🗳️ <strong>${target.name}</strong> foi eliminado.
            </div>
        `;

        if (target.subclass === 'bomba') {
            resultHtml += `
                <div class="result-banner result-bomb-win">
                    💣 A BOMBA FOI ELIMINADA E VENCEU O JOGO!
                </div>
            `;
            game.winner = 'bomba';
            game.phase = 'gameover';
            mainCard.innerHTML = resultHtml;
            setTimeout(() => endGame(), 1000);
            return;
        }

        mainCard.innerHTML = resultHtml;

        if (checkWinCondition()) return;
        if (game.pendingVingadorRevenge) return;

        setTimeout(() => proceedToNextNight(), 700);
    }

    function proceedToNextNight() {
        rewardSurvivors();

        game.handcuffedPlayer = null;
        game.phase = 'night';
        game.round++;
        game.nightStep = 0;
        game.nightTargets = {};
        game.eliminatedTonight = [];
        game.savedTonight = null;
        game.mutedPlayer = null;
        game.dayStep = 0;

        addLog(`🌙 Noite ${game.round} começa...`);
        renderGame();
    }

    function endGame() {
        const mainCard = document.getElementById('gameMainCard');
        if (mainCard) mainCard.innerHTML = '';

        const titles = {
            bomba: ['💣', 'Bomba Venceu!', '#e09940', 'A Bomba alcançou seu objetivo e foi eliminada pelo voto.'],
            cidadaos: ['🏆', 'Cidadãos Venceram!', '#80dba0', 'Todos os Assassinos foram eliminados!'],
            assassino: ['🔪', 'Assassino Venceu!', '#d65d5d', 'A cidade sucumbiu ao terror do Assassino.']
        };

        const win = titles[game.winner] || titles.cidadaos;

        document.getElementById('gameoverIcon').textContent = win[0];
        document.getElementById('gameoverTitle').textContent = win[1];
        document.getElementById('gameoverTitle').style.color = win[2];

        const details = game.players.map(player => {
            const classIcon = CLASS_DEFS[player.role].icon;
            const subIcon = player.subclass ? SUBCLASS_DEFS[player.subclass].icon : '';
            return `
                ${classIcon}${subIcon} ${player.name}: ${CLASS_DEFS[player.role].name} ${player.subclass ? `(${SUBCLASS_DEFS[player.subclass].name})` : ''} ${player.alive ? '✅' : '💀'} 🪙${player.coins || 0}
            `;
        }).join('<br>');

        document.getElementById('gameoverSubtitle').innerHTML = `${win[3]}<br><br><span style="font-size:0.7em;color:var(--text-muted);">${details}</span>`;
        addLog(`🏁 Fim de jogo: ${win[1]}`);
        updateGameLog();
        showScreen('gameover');

        document.getElementById('btnRestart').onclick = () => renderSetup();
    }

    renderSetup();
})();
</script>

</body>
</html>
